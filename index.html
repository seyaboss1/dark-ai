<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;font-size:14px;color:#eaf0ff;background:#05060f}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(circle at 20% 10%,rgba(0,212,255,.18),transparent 45%),radial-gradient(circle at 80% 90%,rgba(168,85,247,.18),transparent 45%),radial-gradient(circle at 50% 50%,rgba(244,114,182,.06),transparent 60%);z-index:-2;animation:bgp 12s ease-in-out infinite}
body::after{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(0,212,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(0,212,255,.025) 1px,transparent 1px);background-size:44px 44px;mask-image:radial-gradient(ellipse at center,black 40%,transparent 85%);z-index:-1;pointer-events:none}
@keyframes bgp{0%,100%{opacity:.85;transform:scale(1)}50%{opacity:1;transform:scale(1.05)}}
header{position:fixed;top:0;left:0;right:0;height:60px;background:rgba(5,6,15,.85);backdrop-filter:blur(28px);border-bottom:1px solid rgba(0,212,255,.2);display:flex;align-items:center;justify-content:space-between;padding:0 18px;z-index:100;gap:12px}
.logo{display:flex;align-items:center;gap:10px;font-weight:900;letter-spacing:2px;font-size:15px}
.lm{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,#00d4ff,#7c3aed);display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 0 24px rgba(0,212,255,.6),inset 0 1px 0 rgba(255,255,255,.3);position:relative;overflow:hidden}
.lm::after{content:'';position:absolute;inset:0;background:linear-gradient(45deg,transparent 40%,rgba(255,255,255,.5) 50%,transparent 60%);animation:shine 3s infinite}
@keyframes shine{to{transform:translateX(100%)}}
.lt{background:linear-gradient(135deg,#00d4ff,#a855f7,#f472b6);background-size:200% auto;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:txt 4s linear infinite}
@keyframes txt{to{background-position:200% center}}
.tick{display:flex;gap:10px;font-size:12px;font-weight:700;flex-wrap:wrap;flex:1;justify-content:center}
.tk{padding:6px 12px;border-radius:9px;background:rgba(15,20,40,.85);border:1px solid rgba(0,212,255,.25);display:flex;gap:8px;align-items:center;font-size:11px;backdrop-filter:blur(10px);transition:all .3s}
.tk:hover{transform:translateY(-1px);border-color:#00d4ff;box-shadow:0 4px 16px rgba(0,212,255,.3)}

.up{color:#00e676}.dn{color:#ff3d5f}
.bbal{display:flex;flex-direction:column;align-items:flex-end;font-size:10px;color:#7a86b0;font-weight:700}
.bbal b{font-size:16px;font-family:monospace;background:linear-gradient(135deg,#00d4ff,#7c3aed);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.bpl{font-size:11px;font-family:monospace;font-weight:800;margin-top:2px}
.bpl.p{color:#00e676;text-shadow:0 0 8px rgba(0,230,118,.5)}
.bpl.n{color:#ff3d5f;text-shadow:0 0 8px rgba(255,61,95,.5)}
.menu3{width:42px;height:42px;border-radius:12px;background:rgba(15,20,40,.85);border:1px solid rgba(0,212,255,.3);color:#00d4ff;cursor:pointer;font-size:20px;font-weight:900;display:flex;align-items:center;justify-content:center;font-family:inherit;flex-shrink:0;transition:all .3s;backdrop-filter:blur(10px)}
.menu3:hover{background:linear-gradient(135deg,#00d4ff,#7c3aed);color:#fff;border-color:transparent;box-shadow:0 0 24px rgba(0,212,255,.5)}
main{position:fixed;top:60px;left:0;right:0;bottom:0}
#chart{width:100%;height:100%}
#panel{position:absolute;top:16px;left:16px;background:rgba(5,6,15,.9);backdrop-filter:blur(24px);border:1px solid rgba(0,212,255,.3);border-radius:18px;padding:16px 18px;min-width:300px;max-width:360px;z-index:10;box-shadow:0 20px 60px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.05);transition:all .3s}
#panel.buy{border-color:rgba(0,230,118,.7);box-shadow:0 0 40px rgba(0,230,118,.25),0 20px 60px rgba(0,0,0,.6)}

#panel.sell .pi{background:linear-gradient(135deg,#ff3d5f,#f472b6);box-shadow:0 8px 24px rgba(255,61,95,.5)}

.pt{font-size:10px;color:#7a86b0;font-weight:800;letter-spacing:2px;text-transform:uppercase}

.pr::after{content:'';position:absolute;inset:5px;border-radius:50%;background:#05060f}

.pst{font-size:11px;color:#7a86b0;line-height:1.6}

#mn{position:fixed;top:70px;right:16px;background:rgba(5,6,15,.97);backdrop-filter:blur(28px);border:1px solid rgba(0,212,255,.3);border-radius:18px;padding:8px;min-width:250px;z-index:150;display:none;box-shadow:0 20px 60px rgba(0,0,0,.8),0 0 40px rgba(0,212,255,.15)}

.mi{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:11px;color:#eaf0ff;cursor:pointer;font-size:13px;font-weight:700;background:transparent;border:none;width:100%;font-family:inherit;text-align:left;transition:all .2s}

.mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid rgba(0,212,255,.2)}
.mh h2{font-size:19px;font-weight:900;background:linear-gradient(135deg,#00d4ff,#a855f7,#f472b6);background-size:200% auto;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:txt 4s linear infinite}
.mclose{background:transparent;border:1px solid rgba(0,212,255,.3);color:#7a86b0;width:38px;height:38px;border-radius:11px;cursor:pointer;font-size:18px;font-family:inherit;transition:all .2s}
.mclose:hover{background:#ff3d5f;color:#fff;border-color:transparent;transform:rotate(90deg)}

.st{background:rgba(15,20,40,.7);border:1px solid rgba(0,212,255,.2);border-radius:11px;padding:12px 16px;display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px;transition:all .2s}

.tpnl.n{color:#ff3d5f;text-shadow:0 0 8px rgba(255,61,95,.5)}

.sgm{color:#7a86b0;font-size:11px;line-height:1.5}

.tg{background:rgba(15,20,40,.9);border:1px solid rgba(0,212,255,.3);color:#7a86b0;padding:9px 16px;border-radius:11px;font-weight:800;font-size:12px;cursor:pointer;font-family:inherit;text-transform:uppercase;margin:0 8px 8px 0;letter-spacing:1px;transition:all .25s}
.tg.on{background:linear-gradient(135deg,#00e676,#00d4ff);color:#000;border-color:transparent;box-shadow:0 4px 20px rgba(0,230,118,.4)}

.chat{height:380px;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:10px;background:rgba(5,6,15,.5);border-radius:14px;border:1px solid rgba(0,212,255,.15);margin-bottom:12px}
.chat::-webkit-scrollbar{width:6px}
.chat::-webkit-scrollbar-thumb{background:rgba(0,212,255,.3);border-radius:3px}
.msg{padding:11px 15px;border-radius:14px;font-size:13px;line-height:1.6;max-width:88%;word-wrap:break-word;white-space:pre-wrap}
.msg.u{background:linear-gradient(135deg,#00d4ff,#7c3aed);color:#fff;align-self:flex-end;font-weight:500;box-shadow:0 4px 16px rgba(0,212,255,.35)}
.msg.a{background:rgba(15,20,40,.9);border:1px solid rgba(0,212,255,.2);align-self:flex-start}
.msg.a code{background:#0a0e1a;color:#00d4ff;padding:2px 6px;border-radius:5px;font-family:monospace;font-size:.85em}

.ci{display:flex;gap:8px}
.ci textarea{flex:1;background:rgba(15,20,40,.9);border:1px solid rgba(0,212,255,.3);border-radius:12px;padding:11px 14px;color:#eaf0ff;font-family:inherit;font-size:13px;resize:none;min-height:46px;max-height:110px;outline:none;transition:all .25s}
.ci textarea:focus{border-color:#00d4ff;box-shadow:0 0 0 3px rgba(0,212,255,.15)}
.sbtn{background:linear-gradient(135deg,#00d4ff,#7c3aed);color:#fff;border:none;width:48px;border-radius:12px;cursor:pointer;font-size:20px;transition:all .25s}
.sbtn:hover{transform:scale(1.05);box-shadow:0 4px 20px rgba(0,212,255,.5)}
.tp{display:inline-flex;gap:4px}
.tp span{width:7px;height:7px;border-radius:50%;background:#00d4ff;animation:bo 1.2s infinite}
.tp span:nth-child(2){animation-delay:.15s;background:#7c3aed}
.tp span:nth-child(3){animation-delay:.3s;background:#f472b6}
@keyframes bo{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-6px);opacity:1}}
.ni{padding:12px 14px;border-radius:11px;background:rgba(15,20,40,.7);border:1px solid rgba(0,212,255,.2);font-size:12px;margin-bottom:10px;transition:all .2s}
.ni:hover{border-color:#00d4ff;transform:translateX(3px)}
.ni .src{font-size:10px;color:#7a86b0;margin-top:5px}
.imp{display:inline-block;padding:2px 9px;border-radius:999px;font-size:10px;font-weight:800;margin-left:8px}
.imp.high{background:rgba(255,61,95,.25);color:#ff3d5f}
.imp.med{background:rgba(255,179,0,.25);color:#ffb300}
.imp.low{background:rgba(0,230,118,.25);color:#00e676}
.lb{background:linear-gradient(135deg,rgba(0,230,118,.15),rgba(0,212,255,.1));border:1px solid rgba(0,230,118,.4);border-radius:14px;padding:14px;margin-bottom:14px;font-size:12px;line-height:1.7}
.lb b{color:#00e676}
.symGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:14px}
.syb{padding:12px;background:rgba(15,20,40,.7);border:1px solid rgba(0,212,255,.25);color:#eaf0ff;border-radius:11px;cursor:pointer;font-family:inherit;font-weight:700;font-size:13px;transition:all .25s}
.syb:hover{border-color:#00d4ff;transform:translateY(-2px);box-shadow:0 4px 16px rgba(0,212,255,.2)}
.syb.active{background:linear-gradient(135deg,#00d4ff,#7c3aed);color:#fff;border-color:transparent}
</style>

<script>
/* ============ STATE ============ */
const S={pr:{GOLD:0,BTC:0},pv:{GOLD:0,BTC:0},cd:{GOLD:[],BTC:[]},sg:[],dc:[],tr:[],bal:10000,at:false,as:'GOLD',lt:{GOLD:0,BTC:0},learned:{},wins:0,losses:0,streak:0,bestStreak:0,sym:'PAXGUSDT',label:'🥇 Gold (XAUUSD)'};
const CM=15000,TD=180000;
let chart,candleSeries,volSeries,lines=[];
try{const l=localStorage.getItem('darkai_lrn2');if(l)S.learned=JSON.parse(l);}catch(e){}
function saveL(){try{localStorage.setItem('darkai_lrn2',JSON.stringify(S.learned));}catch(e){}}

/* ============ CHART INIT ============ */
function initChart(){
  const el=document.getElementById('chart');
  chart=LightweightCharts.createChart(el,{
    layout:{background:{color:'transparent'},textColor:'#7a86b0',fontSize:11,fontFamily:'system-ui'},
    grid:{vertLines:{color:'rgba(0,212,255,.06)'},horzLines:{color:'rgba(0,212,255,.06)'}},
    crosshair:{mode:LightweightCharts.CrosshairMode.Normal,vertLine:{color:'#00d4ff',width:1,style:2,labelBackgroundColor:'#00d4ff'},horzLine:{color:'#00d4ff',width:1,style:2,labelBackgroundColor:'#00d4ff'}},
    rightPriceScale:{borderColor:'rgba(0,212,255,.2)',scaleMargins:{top:.1,bottom:.1}},
    timeScale:{borderColor:'rgba(0,212,255,.2)',timeVisible:true,secondsVisible:false},
    handleScroll:true,handleScale:true
  });
  candleSeries=chart.addCandlestickSeries({upColor:'#00e676',downColor:'#ff3d5f',borderUpColor:'#00e676',borderDownColor:'#ff3d5f',wickUpColor:'#00e676',wickDownColor:'#ff3d5f'});
  volSeries=chart.addHistogramSeries({priceFormat:{type:'volume'},priceScaleId:'',scaleMargins:{top:.85,bottom:0},color:'rgba(0,212,255,.4)'});
  new ResizeObserver(()=>chart.applyOptions({width:el.clientWidth,height:el.clientHeight})).observe(el);
}

/* ============ DATA LOAD ============ */
async function loadHistory(){
  try{
    const r=await fetch('https://api.binance.com/api/v3/klines?symbol='+S.sym+'&interval=1m&limit=300');
    const data=await r.json();
    const candles=data.map(k=>({time:Math.floor(k[0]/1000),open:+k[1],high:+k[2],low:+k[3],close:+k[4]}));
    const vols=data.map(k=>({time:Math.floor(k[0]/1000),value:+k[5],color:+k[4]>=+k[1]?'rgba(0,230,118,.4)':'rgba(255,61,95,.4)'}));
    candleSeries.setData(candles);
    volSeries.setData(vols);
    /* convert to internal candle format for analysis */
    S.cd[S.as]=data.map(k=>({t:k[0],o:+k[1],h:+k[2],l:+k[3],c:+k[4]}));
    S.pr[S.as]=+data[data.length-1][4];
    chart.timeScale().fitContent();
    runAnalysis(S.as);
  }catch(e){console.error('History load:',e);}
}

function connectWS(){
  const w=new WebSocket('wss://stream.binance.com:9443/ws/'+S.sym.toLowerCase()+'@kline_1m');
  w.onmessage=e=>{
    const d=JSON.parse(e.data).k;
    const c={time:Math.floor(d.t/1000),open:+d.o,high:+d.h,low:+d.l,close:+d.c};
    candleSeries.update(c);
    volSeries.update({time:c.time,value:+d.v,color:+d.c>=+d.o?'rgba(0,230,118,.4)':'rgba(255,61,95,.4)'});
    const p=+d.c;
    S.pv[S.as]=S.pr[S.as]||p;
    S.pr[S.as]=p;
    const arr=S.cd[S.as];
    const last=arr[arr.length-1];
    if(last&&last.t===d.t){last.h=+d.h;last.l=+d.l;last.c=p;}
    else{arr.push({t:d.t,o:+d.o,h:+d.h,l:+d.l,c:p});if(arr.length>300)arr.shift();runAnalysis(S.as);}
    tt();ut();
  };
  w.onclose=()=>setTimeout(connectWS,3000);
  w.onerror=()=>w.close();
}

/* ============ INDICATORS ============ */
function em(a,p){if(a.length<p)return null;const k=2/(p+1);let e=a.slice(0,p).reduce((x,y)=>x+y,0)/p;for(let i=p;i<a.length;i++)e=a[i]*k+e*(1-k);return e;}
function rs(c,p){p=p||14;if(c.length<p+1)return null;let g=0,l=0;for(let i=c.length-p;i<c.length;i++){const d=c[i]-c[i-1];if(d>=0)g+=d;else l-=d;}return 100-100/(1+(g/(l||1e-4)));}
function mc(c){if(c.length<26)return null;const e12=em(c,12),e26=em(c,26);if(!e12||!e26)return null;const l=e12-e26;const h=[];for(let i=26;i<=c.length;i++){const a=em(c.slice(0,i),12);const b=em(c.slice(0,i),26);if(a&&b)h.push(a-b);}const s=em(h.slice(-30),9);return{hist:l-(s||l)};}
function bl(c){if(c.length<20)return null;const s=c.slice(-20);const m=s.reduce((a,b)=>a+b,0)/20;const v=s.reduce((a,b)=>a+(b-m)*(b-m),0)/20;const d=Math.sqrt(v);return{u:m+2*d,m,l:m-2*d};}
function atr(a){if(a.length<2)return null;const s=a.slice(-14);return Math.max(...s.map(c=>c.h))-Math.min(...s.map(c=>c.l));}
function sr(a){if(a.length<10)return null;const s=a.slice(-30);const h=s.map(c=>c.h).sort((x,y)=>y-x);const l=s.map(c=>c.l).sort((x,y)=>x-y);return{r:h.slice(0,3).reduce((x,y)=>x+y,0)/3,s:l.slice(0,3).reduce((x,y)=>x+y,0)/3};}

/* ============ ANALYSIS + LEARNING ============ */
function runAnalysis(k){
  const a=S.cd[k];if(a.length<30)return;
  const c=a.map(x=>x.c),p=S.pr[k];
  const e9=em(c,9),e21=em(c,21),e50=em(c,50),r=rs(c,14),m=mc(c),b=bl(c),aT=atr(a),s=sr(a);
  if(!e9||!e21||!r||!m||!b||!aT)return;
  let sc=0;const why=[];
  if(e9>e21){sc+=20;why.push('EMA9>EMA21 bullish');}else{sc-=20;why.push('EMA9<EMA21 bearish');}
  if(e50){if(p>e50){sc+=10;why.push('Above EMA50');}else{sc-=10;why.push('Below EMA50');}}
  if(r<30){sc+=25;why.push('RSI oversold '+r.toFixed(0));}else if(r>70){sc-=25;why.push('RSI overbought '+r.toFixed(0));}
  if(m.hist>0){sc+=15;why.push('MACD+');}else{sc-=15;why.push('MACD-');}
  if(p<b.l){sc+=20;why.push('Below BB lower');}else if(p>b.u){sc-=20;why.push('Above BB upper');}
  const pk=(e9>e21?'U':'D')+(r<35?'O':r>65?'B':'M')+(m.hist>0?'P':'N');
  const lr=S.learned[pk];
  if(lr&&lr.tot>=5){const wr=lr.w/lr.tot;if(wr>0.6){sc=Math.round(sc*1.15);why.push('🧠 AI: '+Math.round(wr*100)+'% win rate');}else if(wr<0.4){sc=Math.round(sc*0.85);why.push('⚠ AI: only '+Math.round(wr*100)+'%');}}
  let act='wait',dir=null;
  if(sc>=40){act='buy';dir='buy';}else if(sc<=-40){act='sell';dir='sell';}
  const sd=aT*0.9,t1=aT*1.2,t2=aT*2.2;let sl=null,tp1=null,tp2=null,ex='';
  if(dir==='buy'){sl=p-sd;tp1=p+t1;tp2=p+t2;ex='Exit below '+sl.toFixed(2);}
  else if(dir==='sell'){sl=p+sd;tp1=p-t1;tp2=p-t2;ex='Exit above '+sl.toFixed(2);}
  else{ex='Wait break '+(s?s.r.toFixed(2):'?')+' / '+(s?s.s.toFixed(2):'?');}
  const d={key:k,symbol:S.label,act,dir,p,sl,tp1,tp2,str:Math.min(100,Math.abs(sc)+40),sc,why,ex,ts:Date.now(),e9,e21,e50,r,m,b,s,pk};
  S.dc.unshift(d);if(S.dc.length>60)S.dc.pop();
  if(act!=='wait'&&Date.now()-(S.lt[k]||0)>60000){S.lt[k]=Date.now();S.sg.unshift(d);if(S.sg.length>40)S.sg.pop();pl();if(S.at)ot(d);}
  drawLines(d);rsp();
}

/* ============ PRICE LINES ============ */
function drawLines(d){
  if(!candleSeries)return;
  lines.forEach(l=>{try{candleSeries.removePriceLine(l);}catch(e){}});
  lines=[];
  if(!d||!d.sl)return;
  lines.push(candleSeries.createPriceLine({price:d.p,color:'#00d4ff',lineWidth:2,lineStyle:LightweightCharts.LineStyle.Solid,axisLabelVisible:true,title:'ENTRY'}));
  lines.push(candleSeries.createPriceLine({price:d.sl,color:'#ff3d5f',lineWidth:2,lineStyle:LightweightCharts.LineStyle.Dashed,axisLabelVisible:true,title:'SL'}));
  lines.push(candleSeries.createPriceLine({price:d.tp1,color:'#00e676',lineWidth:2,lineStyle:LightweightCharts.LineStyle.Dashed,axisLabelVisible:true,title:'TP1'}));
  lines.push(candleSeries.createPriceLine({price:d.tp2,color:'#ffd54f',lineWidth:2,lineStyle:LightweightCharts.LineStyle.Dashed,axisLabelVisible:true,title:'TP2'}));
}

/* ============ AUTO TRADE + LEARN ============ */
function ot(d){S.tr.unshift({id:Date.now()+Math.random(),symbol:d.symbol,key:d.key,dir:d.dir,e:d.p,sl:d.sl,tp:d.tp1,sz:.01,ot:Date.now(),dur:TD,st:'open',pnl:0,ep:null,er:null,pk:d.pk});if(S.tr.length>100)S.tr.pop();}
function ut(){
  let dirty=false;
  for(let i=0;i<S.tr.length;i++){
    const t=S.tr[i];if(t.st!=='open')continue;
    const p=S.pr[t.key];if(!p)continue;
    const df=t.dir==='buy'?p-t.e:t.e-p;
    t.pnl=df*t.sz*100;
    const el=Date.now()-t.ot;let c=false;
    if(t.dir==='buy'){if(p<=t.sl){t.st='loss';t.ep=p;t.er='SL';c=true;}else if(p>=t.tp){t.st='win';t.ep=p;t.er='TP';c=true;}}
    else{if(p>=t.sl){t.st='loss';t.ep=p;t.er='SL';c=true;}else if(p<=t.tp){t.st='win';t.ep=p;t.er='TP';c=true;}}
    if(!c&&el>=t.dur){t.st=t.pnl>=0?'win':'loss';t.ep=p;t.er='Time';c=true;}
    if(c){
      t.ct=Date.now();S.bal+=t.pnl;
      if(!S.learned[t.pk])S.learned[t.pk]={w:0,l:0,tot:0};
      S.learned[t.pk].tot++;
      if(t.st==='win'){S.learned[t.pk].w++;S.wins++;S.streak=Math.max(1,S.streak+1);if(S.streak>S.bestStreak)S.bestStreak=S.streak;}
      else{S.learned[t.pk].l++;S.losses++;S.streak=Math.min(-1,S.streak-1);}
      saveL();
    }
    dirty=true;
  }
  if(dirty){ub();if(document.getElementById('modal').classList.contains('open')){const t=document.getElementById('mtitle').textContent;if(t.includes('Auto Trade'))mAuto();else if(t.includes('Statistics'))mStats();}}
}

/* ============ SOUND ============ */
function pl(){try{const c=new (window.AudioContext||window.webkitAudioContext)();const o=c.createOscillator();const g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.setValueAtTime(880,c.currentTime);o.frequency.exponentialRampToValueAtTime(1320,c.currentTime+.15);g.gain.setValueAtTime(.0001,c.currentTime);g.gain.exponentialRampToValueAtTime(.2,c.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+.35);o.start();o.stop(c.currentTime+.35);}catch(e){}}
