<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DARK AI Pro v5</title>
<script src="https://js.puter.com/v2/"></script>
<script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;font-size:13px;color:#eaf0ff;background:#0a1230}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 10% 0%,rgba(0,180,255,.25),transparent 50%),radial-gradient(ellipse at 90% 100%,rgba(160,80,255,.28),transparent 50%),radial-gradient(circle at 50% 50%,rgba(0,230,180,.1),transparent 60%),linear-gradient(135deg,#0a1230 0%,#141a3e 50%,#1a1450 100%);z-index:-2}
body::after{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(0,212,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(0,212,255,.035) 1px,transparent 1px);background-size:50px 50px;mask-image:radial-gradient(ellipse at center,black 40%,transparent 90%);z-index:-1;pointer-events:none}
header{position:fixed;top:0;left:0;right:0;height:56px;background:linear-gradient(180deg,rgba(10,18,48,.95),rgba(10,18,48,.7));backdrop-filter:blur(28px);border-bottom:1px solid rgba(0,212,255,.22);display:flex;align-items:center;padding:0 14px;z-index:100;gap:10px;box-shadow:0 4px 30px rgba(0,180,255,.12)}
.logo{display:flex;align-items:center;gap:9px;font-weight:900;letter-spacing:2px;font-size:14px;flex-shrink:0}
.lm{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#00d4ff,#7c3aed);display:flex;align-items:center;justify-content:center;font-size:17px;box-shadow:0 0 22px rgba(0,212,255,.6),inset 0 1px 0 rgba(255,255,255,.3);position:relative;overflow:hidden}
.lm::after{content:'';position:absolute;inset:0;background:linear-gradient(45deg,transparent 40%,rgba(255,255,255,.5) 50%,transparent 60%);animation:shine 3s infinite}
@keyframes shine{to{transform:translateX(100%)}}
.lt{background:linear-gradient(135deg,#00d4ff,#a855f7,#f472b6,#00d4ff);background-size:300% auto;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:txt 5s linear infinite}
@keyframes txt{to{background-position:300% center}}
.hBadge{padding:5px 12px;border-radius:9px;font-weight:900;font-size:12px;letter-spacing:1px;border:2px solid transparent;transition:all .4s;flex-shrink:0}
.hBadge.buy{background:linear-gradient(135deg,rgba(0,230,118,.25),rgba(0,212,255,.15));color:#00e676;border-color:#00e676;box-shadow:0 0 20px rgba(0,230,118,.6);animation:puB 1.5s infinite}
.hBadge.sell{background:linear-gradient(135deg,rgba(255,61,95,.25),rgba(244,114,182,.15));color:#ff3d5f;border-color:#ff3d5f;box-shadow:0 0 20px rgba(255,61,95,.6);animation:puB 1.5s infinite}
.hBadge.wait{background:rgba(255,179,0,.15);color:#ffb300;border-color:rgba(255,179,0,.6)}
@keyframes puB{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.symBox{padding:5px 12px;border-radius:9px;background:linear-gradient(135deg,rgba(0,212,255,.15),rgba(124,58,237,.15));border:1px solid rgba(0,212,255,.4);font-weight:800;font-size:12px;display:flex;gap:8px;align-items:center;backdrop-filter:blur(10px);cursor:pointer;transition:all .25s}
.symBox:hover{border-color:#00d4ff}
.symBox .nm{font-size:10px;color:#9aa4cc;letter-spacing:1px;text-transform:uppercase}
.symBox b{color:#ffd54f;font-family:monospace;font-size:13px}
.priceBox{padding:5px 10px;border-radius:9px;background:rgba(15,20,50,.85);border:1px solid rgba(0,212,255,.25);font-family:monospace;font-weight:900;font-size:14px;color:#00e676;flex-shrink:0}
.priceBox.dn{color:#ff3d5f}
.wl{display:flex;gap:5px;flex:1;overflow-x:auto;padding:2px;scrollbar-width:none;justify-content:center}
.wl::-webkit-scrollbar{display:none}
.wt{padding:4px 9px;border-radius:8px;background:rgba(15,20,50,.85);border:1px solid rgba(0,212,255,.2);display:flex;gap:5px;align-items:center;font-size:10px;font-weight:700;cursor:pointer;transition:all .3s;position:relative;flex-shrink:0}
.wt:hover{border-color:#00d4ff}
.wt.sig{border-color:#00e676;box-shadow:0 0 12px rgba(0,230,118,.6)}
.wt b{color:#ffd54f;font-family:monospace;font-size:11px}
.wt .chg{font-size:9px}
.wt .dot{position:absolute;top:-3px;right:-3px;width:8px;height:8px;border-radius:50%;background:#00e676;border:2px solid #0a1230;animation:puB 1s infinite}
.bbal{display:flex;flex-direction:column;align-items:flex-end;font-size:9px;color:#9aa4cc;font-weight:700;flex-shrink:0}
.bbal b{font-size:14px;font-family:monospace;background:linear-gradient(135deg,#00d4ff,#a855f7);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.bpl{font-size:10px;font-family:monospace;font-weight:800;margin-top:1px}
.bpl.p{color:#00e676}.bpl.n{color:#ff3d5f}
.menu3{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,rgba(0,212,255,.15),rgba(124,58,237,.15));border:1px solid rgba(0,212,255,.4);color:#00d4ff;cursor:pointer;font-size:19px;font-weight:900;display:flex;align-items:center;justify-content:center;font-family:inherit;flex-shrink:0;transition:all .3s}
.menu3:hover{background:linear-gradient(135deg,#00d4ff,#7c3aed);color:#fff;border-color:transparent}
main{position:fixed;top:56px;left:0;right:0;bottom:0}
#chart{width:100%;height:100%}
.ovl{position:absolute;backdrop-filter:blur(20px);border-radius:14px;border:1px solid rgba(0,212,255,.3);background:rgba(10,18,48,.75);box-shadow:0 12px 40px rgba(0,0,0,.5);z-index:10}
#decOvl{top:14px;left:14px;padding:12px 14px;min-width:270px;max-width:320px;transition:all .3s}
#decOvl.buy{border-color:rgba(0,230,118,.6);box-shadow:0 0 40px rgba(0,230,118,.25),0 12px 40px rgba(0,0,0,.5)}
#decOvl.sell{border-color:rgba(255,61,95,.6);box-shadow:0 0 40px rgba(255,61,95,.25),0 12px 40px rgba(0,0,0,.5)}
#decOvl.wait{border-color:rgba(255,179,0,.5)}
.decH{display:flex;align-items:center;gap:10px}
.decIc{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#00d4ff,#7c3aed);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
#decOvl.buy .decIc{background:linear-gradient(135deg,#00e676,#00d4ff);box-shadow:0 8px 24px rgba(0,230,118,.5)}
#decOvl.sell .decIc{background:linear-gradient(135deg,#ff3d5f,#f472b6);box-shadow:0 8px 24px rgba(255,61,95,.5)}
#decOvl.wait .decIc{background:linear-gradient(135deg,#ffb300,#ffd54f)}
.decT{font-size:9px;color:#9aa4cc;font-weight:800;letter-spacing:2px;text-transform:uppercase}
.decA{font-size:17px;font-weight:900;line-height:1.15;margin-top:2px}
#decOvl.buy .decA{color:#00e676}
#decOvl.sell .decA{color:#ff3d5f}
#decOvl.wait .decA{color:#ffb300}
.decW{font-size:10px;color:#9aa4cc;line-height:1.5;margin-top:6px;max-height:44px;overflow:hidden}
.decStr{display:flex;align-items:center;gap:10px;margin-top:10px;padding-top:8px;border-top:1px solid rgba(0,212,255,.15)}
.sring{width:48px;height:48px;border-radius:50%;position:relative;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:12px;font-family:monospace;flex-shrink:0}
.sring::after{content:'';position:absolute;inset:4px;border-radius:50%;background:#0a1230}
.sring span{position:relative;z-index:2}
.decStats{font-size:10px;color:#9aa4cc;line-height:1.5}
.decStats b{color:#eaf0ff}
/* Timeframe (top-right, small) */
#tfOvl{top:14px;right:14px;padding:7px;display:flex;gap:4px}
.tfb{padding:5px 9px;background:rgba(15,20,50,.8);border:1px solid rgba(0,212,255,.25);color:#9aa4cc;border-radius:8px;font-weight:800;font-size:10px;cursor:pointer;font-family:inherit;transition:all .25s;text-transform:uppercase}
.tfb:hover{border-color:#00d4ff;color:#00d4ff}
.tfb.active{background:linear-gradient(135deg,#00d4ff,#7c3aed);color:#fff;border-color:transparent;box-shadow:0 4px 16px rgba(0,212,255,.4)}
/* Patterns (below TF) */
#patOvl{top:60px;right:14px;padding:8px 10px;background:rgba(10,18,48,.55);border:1px solid rgba(0,212,255,.25);font-size:10px;max-width:200px;border-radius:12px}
.patRow{display:flex;gap:6px;align-items:center;padding:2px 0;font-size:10px}
.patRow .pdot{width:6px;height:6px;border-radius:50%;background:#7a86b0;flex-shrink:0}
.patRow .pdot.bull{background:#00e676;box-shadow:0 0 8px #00e676}
.patRow .pdot.bear{background:#ff3d5f;box-shadow:0 0 8px #ff3d5f}
.patRow .pdot.neu{background:#ffb300}
.patRow .pname{color:#eaf0ff;font-weight:700}
/* Levels (bottom-right) with USD */
#lvlOvl{bottom:14px;right:14px;padding:10px 12px;min-width:230px;border-radius:12px}
.lvlHead{font-size:9px;color:#9aa4cc;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:6px}
.lvlRow{display:flex;justify-content:space-between;align-items:center;font-size:11px;padding:4px 0;font-family:monospace;border-bottom:1px solid rgba(0,212,255,.08);gap:8px}
.lvlRow:last-child{border-bottom:none}
.lvlRow .k{font-weight:800;letter-spacing:.5px;min-width:48px}
.lvlRow .p{font-weight:900;margin-left:auto}
.lvlRow .u{font-weight:900;font-size:10px;min-width:56px;text-align:right}
.lvlRow.entry .k,.lvlRow.entry .p{color:#00d4ff}
.lvlRow.sl .k,.lvlRow.sl .p,.lvlRow.sl .u{color:#ff3d5f}
.lvlRow.tp1 .k,.lvlRow.tp1 .p,.lvlRow.tp1 .u{color:#00e676}
.lvlRow.tp2 .k,.lvlRow.tp2 .p,.lvlRow.tp2 .u{color:#ffd54f}
.lvlRow .u.pos::before{content:'+'}
/* Toast */
.toast{position:absolute;top:14px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,rgba(0,230,118,.95),rgba(0,212,255,.9));color:#000;padding:10px 16px;border-radius:12px;font-weight:800;font-size:12px;box-shadow:0 12px 40px rgba(0,230,118,.6);display:none;align-items:center;gap:8px;z-index:20;animation:slideD .4s;max-width:440px}
.toast.show{display:flex}
@keyframes slideD{from{transform:translate(-50%,-120%);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.toast b{font-size:13px;display:block;margin-bottom:2px}
#mn{position:fixed;top:66px;right:14px;background:linear-gradient(180deg,rgba(10,18,48,.99),rgba(15,22,55,.99));backdrop-filter:blur(28px);border:1px solid rgba(0,212,255,.4);border-radius:18px;padding:8px;min-width:250px;z-index:150;display:none;box-shadow:0 24px 70px rgba(0,0,0,.9),0 0 50px rgba(0,212,255,.2)}
#mn.open{display:block;animation:drop .25s}
@keyframes drop{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.mi{display:flex;align-items:center;gap:11px;padding:10px 13px;border-radius:10px;color:#eaf0ff;cursor:pointer;font-size:13px;font-weight:700;background:transparent;border:none;width:100%;font-family:inherit;text-align:left;transition:all .2s}
.mi:hover{background:linear-gradient(135deg,rgba(0,212,255,.2),rgba(124,58,237,.2));color:#00d4ff;transform:translateX(3px)}
.mi .ico{font-size:16px;width:20px;text-align:center}
.msep{height:1px;background:linear-gradient(90deg,transparent,rgba(0,212,255,.3),transparent);margin:5px 8px}
.mtitle{padding:6px 13px;font-size:10px;font-weight:800;color:#7a86b0;letter-spacing:2px;text-transform:uppercase}
#modal{position:fixed;inset:0;background:rgba(5,6,20,.8);backdrop-filter:blur(12px);z-index:200;display:none;align-items:center;justify-content:center;padding:20px}
#modal.open{display:flex;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.mc{background:linear-gradient(135deg,rgba(15,22,55,.98),rgba(20,26,70,.98));border:1px solid rgba(0,212,255,.4);border-radius:20px;padding:22px;max-width:920px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:0 30px 90px rgba(0,0,0,.9)}
.mc::-webkit-scrollbar{width:8px}
.mc::-webkit-scrollbar-thumb{background:rgba(0,212,255,.35);border-radius:4px}
.mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid rgba(0,212,255,.25)}
.mh h2{font-size:17px;font-weight:900;background:linear-gradient(135deg,#00d4ff,#a855f7,#f472b6);background-size:200% auto;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:txt 4s linear infinite}
.mclose{background:transparent;border:1px solid rgba(0,212,255,.3);color:#7a86b0;width:34px;height:34px;border-radius:10px;cursor:pointer;font-size:17px;font-family:inherit;transition:all .25s}
.mclose:hover{background:#ff3d5f;color:#fff;border-color:transparent;transform:rotate(90deg)}
.ct{font-size:11px;font-weight:800;color:#00d4ff;text-transform:uppercase;letter-spacing:2px;margin-bottom:10px;margin-top:8px}
.st{background:rgba(15,20,50,.7);border:1px solid rgba(0,212,255,.2);border-radius:10px;padding:10px 14px;display:flex;justify-content:space-between;font-size:12px;margin-bottom:6px;transition:all .2s}
.st:hover{border-color:#00d4ff;transform:translateX(3px)}
.st b{font-family:monospace;font-weight:900;font-size:13px}
.tr{padding:10px 12px;border-radius:10px;background:rgba(15,20,50,.7);border:1px solid rgba(0,212,255,.2);font-size:11px;display:flex;justify-content:space-between;gap:8px;margin-bottom:6px}
.tr.win{border-left:3px solid #00e676}
.tr.loss{border-left:3px solid #ff3d5f}
.tr.open{border-left:3px solid #ffb300}
.tpnl{font-weight:900;font-family:monospace;font-size:13px}
.tpnl.p{color:#00e676}.tpnl.n{color:#ff3d5f}
.sgm{color:#7a86b0;font-size:10px;line-height:1.4;margin-top:2px}
.tg{background:linear-gradient(135deg,rgba(15,20,50,.9),rgba(25,30,70,.7));border:1px solid rgba(0,212,255,.35);color:#9aa4cc;padding:8px 14px;border-radius:10px;font-weight:800;font-size:11px;cursor:pointer;font-family:inherit;text-transform:uppercase;margin:0 6px 6px 0;letter-spacing:1px;transition:all .25s}
.tg.on{background:linear-gradient(135deg,#00e676,#00d4ff);color:#000;border-color:transparent;box-shadow:0 4px 20px rgba(0,230,118,.5)}
.tg:hover{border-color:#00d4ff;color:#00d4ff}
.chat{height:360px;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:8px;background:rgba(5,6,20,.5);border-radius:12px;border:1px solid rgba(0,212,255,.2);margin-bottom:10px}
.chat::-webkit-scrollbar{width:6px}
.chat::-webkit-scrollbar-thumb{background:rgba(0,212,255,.3);border-radius:3px}
.msg{padding:10px 14px;border-radius:12px;font-size:12px;line-height:1.6;max-width:88%;word-wrap:break-word;white-space:pre-wrap}
.msg.u{background:linear-gradient(135deg,#00d4ff,#7c3aed);color:#fff;align-self:flex-end;font-weight:500}
.msg.a{background:rgba(15,20,50,.9);border:1px solid rgba(0,212,255,.25);align-self:flex-start}
.msg.a code{background:#0a1230;color:#00d4ff;padding:2px 5px;border-radius:4px;font-family:monospace;font-size:.85em}
.msg.a strong{color:#f472b6}
.ci{display:flex;gap:8px}
.ci textarea{flex:1;background:rgba(15,20,50,.9);border:1px solid rgba(0,212,255,.3);border-radius:11px;padding:10px 13px;color:#eaf0ff;font-family:inherit;font-size:12px;resize:none;min-height:44px;max-height:100px;outline:none}
.ci textarea:focus{border-color:#00d4ff}
.sbtn{background:linear-gradient(135deg,#00d4ff,#7c3aed);color:#fff;border:none;width:46px;border-radius:11px;cursor:pointer;font-size:19px}
.tp{display:inline-flex;gap:3px}
.tp span{width:6px;height:6px;border-radius:50%;background:#00d4ff;animation:bo 1.2s infinite}
.tp span:nth-child(2){animation-delay:.15s;background:#7c3aed}
.tp span:nth-child(3){animation-delay:.3s;background:#f472b6}
@keyframes bo{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-6px);opacity:1}}
.ni{padding:11px 13px;border-radius:10px;background:rgba(15,20,50,.7);border:1px solid rgba(0,212,255,.25);font-size:11px;margin-bottom:8px;line-height:1.6}
.ni .src{font-size:10px;color:#7a86b0;margin-top:4px}
.imp{display:inline-block;padding:2px 8px;border-radius:999px;font-size:9px;font-weight:800;margin-left:6px}
.imp.high{background:rgba(255,61,95,.25);color:#ff3d5f}
.imp.med{background:rgba(255,179,0,.25);color:#ffb300}
.imp.low{background:rgba(0,230,118,.25);color:#00e676}
.lb{background:linear-gradient(135deg,rgba(0,230,118,.15),rgba(0,212,255,.12));border:1px solid rgba(0,230,118,.45);border-radius:12px;padding:12px;margin-bottom:12px;font-size:11px;line-height:1.8}
.lb b{color:#00e676}
.symInput{width:100%;background:rgba(15,20,50,.9);border:1px solid rgba(0,212,255,.3);border-radius:10px;padding:10px 14px;color:#eaf0ff;font-family:monospace;font-size:13px;outline:none;margin-bottom:10px}
.sugBox{max-height:300px;overflow-y:auto;border:1px solid rgba(0,212,255,.2);border-radius:10px;background:rgba(5,6,20,.6)}
.sug{display:flex;justify-content:space-between;padding:10px 14px;cursor:pointer;border-bottom:1px solid rgba(0,212,255,.1);font-size:12px}
.sug:hover{background:rgba(0,212,255,.1);color:#00d4ff}
.sug b{font-family:monospace;color:#ffd54f}
.revAlert{background:linear-gradient(135deg,rgba(255,61,95,.2),rgba(255,179,0,.15));border:1px solid rgba(255,61,95,.5);border-radius:10px;padding:8px 10px;margin-top:8px;font-size:10px;display:none}
.revAlert.show{display:block;animation:puB 1.5s infinite}
.revAlert b{color:#ff3d5f}
</style>
</head>
<body>
<header>
<div class="logo"><div class="lm">⚡</div><div class="lt">DARK AI</div></div>
<div class="hBadge wait" id="hBadge">⏸ WAIT</div>
<div class="symBox" id="symBox"><div><div class="nm" id="symNm">GOLD</div></div><b id="symPr">—</b></div>
<div class="priceBox" id="chg">+0.00%</div>
<div class="wl" id="wl"></div>
<div class="bbal">
<div>Balance</div>
<b id="bal">$10,000</b>
<div class="bpl p" id="bpl">$0 (0%)</div>
</div>
<button class="menu3" id="m3">⋮</button>
</header>
<main>
<div id="chart"></div>
<div class="ovl" id="decOvl">
<div class="decH">
<div class="decIc" id="decIc">⏳</div>
<div style="flex:1;min-width:0">
<div class="decT" id="decT">Loading...</div>
<div class="decA" id="decA">Fetching...</div>
</div>
</div>
<div class="decW" id="decW">Connecting...</div>
<div class="revAlert" id="revAlert"></div>
<div class="decStr">
<div class="sring" id="sRing"><span>0%</span></div>
<div class="decStats" id="decStats">Strength <b>0%</b><br>Win Rate <b>—</b><br>Streak <b>0</b></div>
</div>
</div>
<div class="ovl" id="tfOvl">
<button class="tfb" data-tf="1m">1m</button>
<button class="tfb active" data-tf="5m">5m</button>
<button class="tfb" data-tf="15m">15m</button>
<button class="tfb" data-tf="1h">1h</button>
<button class="tfb" data-tf="4h">4h</button>
</div>
<div class="ovl" id="patOvl">
<div style="font-size:9px;color:#9aa4cc;font-weight:800;letter-spacing:1px;text-transform:uppercase;margin-bottom:4px">Patterns</div>
<div id="patList"></div>
</div>
<div class="ovl" id="lvlOvl">
<div class="lvlHead">🎯 Trade Levels (size $1000)</div>
<div class="lvlRow entry"><span class="k">ENTRY</span><span class="p" id="lvEntry">—</span><span class="u" id="lvEntryU">—</span></div>
<div class="lvlRow sl"><span class="k">SL</span><span class="p" id="lvSl">—</span><span class="u" id="lvSlU">—</span></div>
<div class="lvlRow tp1"><span class="k">TP1</span><span class="p" id="lvTp1">—</span><span class="u" id="lvTp1U">—</span></div>
<div class="lvlRow tp2"><span class="k">TP2</span><span class="p" id="lvTp2">—</span><span class="u" id="lvTp2U">—</span></div>
</div>
<div class="toast" id="toast"></div>
</main>
<div id="mn">
<div class="mtitle">Symbol</div>

<script>
/* ============ SYMBOLS ============ */
const SYMS={

  BTCUSDT:{binance:'BTCUSDT',label:'BTC',icon:'₿'},

  BNBUSDT:{binance:'BNBUSDT',label:'BNB',icon:'🟡'},
  XRPUSDT:{binance:'XRPUSDT',label:'XRP',icon:'💧'},
  ADAUSDT:{binance:'ADAUSDT',label:'ADA',icon:'🔷'},
  DOGEUSDT:{binance:'DOGEUSDT',label:'DOGE',icon:'🐕'},
  AVAXUSDT:{binance:'AVAXUSDT',label:'AVAX',icon:'🔺'},
  LINKUSDT:{binance:'LINKUSDT',label:'LINK',icon:'🔗'},
  DOTUSDT:{binance:'DOTUSDT',label:'DOT',icon:'⚫'},

  /* Forex proxies */
  EURUSDT:{binance:'EURUSDT',label:'EUR/USD',icon:'💶'},
  GBPUSDT:{binance:'GBPUSDT',label:'GBP/USD',icon:'💷'},

};
const state={
  focus:'XAUUSD',symbols:{...SYMS},
  prices:{},prev:{},candles:{},candlesByTf:{},
  decisions:{},multiTfDecisions:{},signals:[],trades:[],
  bal:10000,autoTrade:false,autoSwitch:true,
  watchlist:['BTCUSDT','ETHUSDT','EURUSDT','GBPUSDT'],
  tf:'5m',tfMs:{'1m':60000,'5m':300000,'15m':900000,'1h':3600000,'4h':14400000},
  lastSignalTs:{},learned:{},wins:0,losses:0,streak:0,bestStreak:0,
  markers:[],entryMarkers:{},tpWarned:{},voice:{on:true}
};
const POSITION=1000;/* $1000 per trade */
try{const l=localStorage.getItem('darkai_v5');if(l){const d=JSON.parse(l);Object.assign(state,{learned:d.learned||{},wins:d.wins||0,losses:d.losses||0,streak:d.streak||0,bestStreak:d.bestStreak||0,watchlist:d.watchlist||state.watchlist,voice:d.voice||state.voice});}}catch(e){}
function saveS(){try{localStorage.setItem('darkai_v5',JSON.stringify({learned:state.learned,wins:state.wins,losses:state.losses,streak:state.streak,bestStreak:state.bestStreak,watchlist:state.watchlist,voice:state.voice}));}catch(e){}}

/* ============ VOICE ============ */
function speak(text,force){
  if(!state.voice.on&&!force)return;
  try{window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.rate=1.05;u.pitch=1;u.volume=.9;window.speechSynthesis.speak(u);}catch(e){}
}

/* ============ CHART ============ */
let chart,candleSeries,volSeries,ema9,ema21,ema50,priceLines=[];
function initChart(){
  const el=document.getElementById('chart');
  chart=LightweightCharts.createChart(el,{
    layout:{background:{type:'solid',color:'transparent'},textColor:'#9aa4cc',fontSize:11,fontFamily:'system-ui'},
    grid:{vertLines:{color:'rgba(0,212,255,.05)'},horzLines:{color:'rgba(0,212,255,.05)'}},
    crosshair:{mode:LightweightCharts.CrosshairMode.Normal,vertLine:{color:'#00d4ff',width:1,style:2,labelBackgroundColor:'#00d4ff'},horzLine:{color:'#00d4ff',width:1,style:2,labelBackgroundColor:'#00d4ff'}},
    rightPriceScale:{borderColor:'rgba(0,212,255,.25)',scaleMargins:{top:.12,bottom:.15},entireTextOnly:false,minimumWidth:76},
    timeScale:{borderColor:'rgba(0,212,255,.25)',timeVisible:true,secondsVisible:false},
    handleScroll:true,handleScale:true
  });
  candleSeries=chart.addCandlestickSeries({upColor:'#00e676',downColor:'#ff3d5f',borderUpColor:'#00e676',borderDownColor:'#ff3d5f',wickUpColor:'#00e676',wickDownColor:'#ff3d5f'});
  volSeries=chart.addHistogramSeries({priceFormat:{type:'volume'},priceScaleId:'',scaleMargins:{top:.85,bottom:0}});
  ema9=chart.addLineSeries({color:'#00d4ff',lineWidth:1,priceLineVisible:false,lastValueVisible:false});
  ema21=chart.addLineSeries({color:'#a855f7',lineWidth:1,priceLineVisible:false,lastValueVisible:false});
  ema50=chart.addLineSeries({color:'#f472b6',lineWidth:1,priceLineVisible:false,lastValueVisible:false});
  new ResizeObserver(()=>chart.applyOptions({width:el.clientWidth,height:el.clientHeight})).observe(el);
}

/* ============ HELPERS ============ */
const f=(n,d=2)=>{if(n===null||n===undefined||isNaN(n))return'—';return Number(n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});};
function ft(ms){const s=Math.max(0,Math.floor(ms/1000));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
/* USD P&L if hit at price p2 given entry p1 and position size POSITION */
function usdPnl(p1,p2){if(!p1||!p2)return 0;return (p2-p1)/p1*POSITION;}

/* ============ INDICATORS ============ */
function em(a,p){if(a.length<p)return null;const k=2/(p+1);let e=a.slice(0,p).reduce((x,y)=>x+y,0)/p;for(let i=p;i<a.length;i++)e=a[i]*k+e*(1-k);return e;}
function rsi(c,p=14){if(c.length<p+1)return null;let g=0,l=0;for(let i=c.length-p;i<c.length;i++){const d=c[i]-c[i-1];if(d>=0)g+=d;else l-=d;}return 100-100/(1+(g/(l||1e-4)));}
function macd(c){if(c.length<26)return null;const e12=em(c,12),e26=em(c,26);if(!e12||!e26)return null;const l=e12-e26;const h=[];for(let i=26;i<=c.length;i++){const a=em(c.slice(0,i),12),b=em(c.slice(0,i),26);if(a&&b)h.push(a-b);}const s=em(h.slice(-30),9);return{hist:l-(s||l),line:l,signal:s||l};}
function boll(c){if(c.length<20)return null;const s=c.slice(-20);const m=s.reduce((a,b)=>a+b,0)/20;const v=s.reduce((a,b)=>a+(b-m)*(b-m),0)/20;const d=Math.sqrt(v);return{u:m+2*d,m,l:m-2*d,std:d};}
function atr(a){if(a.length<2)return null;const s=a.slice(-14);return Math.max(...s.map(c=>c.h))-Math.min(...s.map(c=>c.l));}
function sr(a){if(a.length<10)return null;const s=a.slice(-30);const h=s.map(c=>c.h).sort((x,y)=>y-x);const l=s.map(c=>c.l).sort((x,y)=>x-y);return{r:h.slice(0,3).reduce((x,y)=>x+y,0)/3,s:l.slice(0,3).reduce((x,y)=>x+y,0)/3};}
function detectPatterns(a){
  if(a.length<20)return[];
  const out=[],last=a.slice(-10),closes=last.map(x=>x.c);
  const hh=closes[9]>closes[7]&&closes[7]>closes[5]&&closes[5]>closes[3];
  const ll=closes[9]<closes[7]&&closes[7]<closes[5]&&closes[5]<closes[3];
  const range=Math.max(...last.map(x=>x.h))-Math.min(...last.map(x=>x.l));
  const body=Math.abs(last[9].c-last[9].o);
  if(hh)out.push({name:'Higher Highs',type:'bull'});
  if(ll)out.push({name:'Lower Lows',type:'bear'});
  if(range>0){
    if(body/range<0.15)out.push({name:'Doji',type:'neu'});
    if(body/range>0.7)out.push({name:last[9].c>last[9].o?'Strong Bull':'Strong Bear',type:last[9].c>last[9].o?'bull':'bear'});
  }
  if(a.length>=20){
    const p=a.slice(-20);
    const upThenDown=p.slice(0,10).every((x,i)=>i===0||x.c>=p[i-1].c)&&p.slice(10).every((x,i)=>i===0||x.c<=p[10+i-1].c);
    const downThenUp=p.slice(0,10).every((x,i)=>i===0||x.c<=p[i-1].c)&&p.slice(10).every((x,i)=>i===0||x.c>=p[10+i-1].c);
    if(upThenDown)out.push({name:'Reversal ↑↓',type:'bear'});
    if(downThenUp)out.push({name:'Reversal ↓↑',type:'bull'});
  }
  if(a.length>=2){
    const p1=a[a.length-2],p2=a[a.length-1];
    if(p2.c>p2.o&&p1.c<p1.o&&p2.c>p1.o&&p2.o<p1.c)out.push({name:'Bull Engulf',type:'bull'});
    if(p2.c<p2.o&&p1.c>p1.o&&p2.c<p1.o&&p2.o>p1.c)out.push({name:'Bear Engulf',type:'bear'});
  }
  return out.slice(0,5);
}

/* ============ ANALYSIS ============ */
function analyzeKey(key){
  const a=state.candles[key];if(!a||a.length<30)return null;
  const c=a.map(x=>x.c),p=state.prices[key];
  const e9=em(c,9),e21=em(c,21),e50=em(c,50),r=rsi(c,14),m=macd(c),b=boll(c),aT=atr(a),s=sr(a),pats=detectPatterns(a);
  if(!e9||!e21||!r||!m||!b||!aT)return null;
  let sc=0;const why=[];
  if(e9>e21){sc+=20;why.push('EMA9>EMA21');}else{sc-=20;why.push('EMA9<EMA21');}
  if(e50){if(p>e50){sc+=12;why.push('Above EMA50');}else{sc-=12;why.push('Below EMA50');}}
  if(r<30){sc+=22;why.push('RSI oversold '+r.toFixed(0));}else if(r>70){sc-=22;why.push('RSI overbought '+r.toFixed(0));}
  if(m.hist>0){sc+=15;why.push('MACD+');}else{sc-=15;why.push('MACD-');}
  if(p<b.l){sc+=18;why.push('Below BB');}else if(p>b.u){sc-=18;why.push('Above BB');}
  pats.forEach(pt=>{if(pt.type==='bull')sc+=5;else if(pt.type==='bear')sc-=5;});
  const pk=state.tf+'_'+(e9>e21?'U':'D')+(r<35?'O':r>65?'B':'M')+(m.hist>0?'P':'N');
  const lr=state.learned[pk];
  if(lr&&lr.tot>=5){const wr=lr.w/lr.tot;if(wr>0.6){sc=Math.round(sc*1.15);why.push('🧠 '+Math.round(wr*100)+'%');}else if(wr<0.4){sc=Math.round(sc*0.85);why.push('⚠ '+Math.round(wr*100)+'%');}}
  let act='wait',dir=null;
  if(sc>=40){act='buy';dir='buy';}else if(sc<=-40){act='sell';dir='sell';}
  /* SL = 25% of TP (ratio 1:4) */
  const tpDist=aT*1.8,slDist=tpDist*0.25,tp1Dist=tpDist*0.5;
  let sl=null,tp1=null,tp2=null,ex='';
  if(dir==='buy'){sl=p-slDist;tp1=p+tp1Dist;tp2=p+tpDist;ex='Exit below '+sl.toFixed(2)+' | Target '+tp2.toFixed(2);}
  else if(dir==='sell'){sl=p+slDist;tp1=p-tp1Dist;tp2=p-tpDist;ex='Exit above '+sl.toFixed(2)+' | Target '+tp2.toFixed(2);}
  else{ex='Wait break '+(s?s.r.toFixed(2):'?')+' / '+(s?s.s.toFixed(2):'?');}
  return {key,label:state.symbols[key].label,act,dir,p,sl,tp1,tp2,str:Math.min(100,Math.abs(sc)+40),sc,why,ex,ts:Date.now(),e9,e21,e50,r,m,b,s,pats,pk,tf:state.tf};
}

function aggregateMultiTF(mtf){
  const acts=Object.values(mtf).map(d=>d?d.act:'wait');
  const buy=acts.filter(a=>a==='buy').length;
  const sell=acts.filter(a=>a==='sell').length;
  if(buy>=4)return'buy';
  if(sell>=4)return'sell';
  if(buy>=3&&sell<=1)return'buy';
  if(sell>=3&&buy<=1)return'sell';
  if(buy>sell&&buy>=2)return'buy';
  if(sell>buy&&sell>=2)return'sell';
  return'wait';
}

function runFullAnalysis(key){
  const d=analyzeKey(key);if(!d)return;
  const mtfDecisions={};
  for(const tf of ['1m','5m','15m','1h','4h']){
    const arr=state.candlesByTf[key]?.[tf];
    if(arr&&arr.length>=30){
      const save=state.candles[key],saveTf=state.tf;
      state.candles[key]=arr;state.tf=tf;
      mtfDecisions[tf]=analyzeKey(key);
      state.candles[key]=save;state.tf=saveTf;
    }
  }
  state.multiTfDecisions[key]=mtfDecisions;
  const mtfAction=aggregateMultiTF(mtfDecisions);
  d.mtfAction=mtfAction;
  d.mtfCounts={buy:Object.values(mtfDecisions).filter(x=>x&&x.act==='buy').length,sell:Object.values(mtfDecisions).filter(x=>x&&x.act==='sell').length,wait:Object.values(mtfDecisions).filter(x=>x&&x.act==='wait').length};
  if(mtfAction!=='wait'){d.act=mtfAction;d.dir=mtfAction;d.why.unshift('✓ MTF '+d.mtfCounts.buy+'B/'+d.mtfCounts.sell+'S/'+d.mtfCounts.wait+'W');}
  state.decisions[key]=d;
  /* Signal - CONFIRMATION REQUIRED */
  const confirmed=d.act!=='wait'&&d.str>=60;
  if(confirmed&&Date.now()-(state.lastSignalTs[key]||0)>45000){
    state.lastSignalTs[key]=Date.now();
    state.signals.unshift(d);if(state.signals.length>50)state.signals.pop();
    /* voice confirm */
    speak('Confirmed '+d.act+' signal on '+d.label+'. Strength '+d.str+' percent. Entry '+d.p.toFixed(2));
    beep();
    if(state.autoTrade)openTrade(d);
    if(key!==state.focus){notify(d);if(state.autoSwitch)switchFocus(key);}
  }
  if(key===state.focus){renderDecision(d);drawLines(d);renderPatterns(d);renderLevels(d);renderHeaderBadge(d);}
  renderWL();
}

/* ============ DATA ============ */
async function loadSymbol(key,tf){
  tf=tf||state.tf;
  const s=state.symbols[key];if(!s)return;
  if(!state.candlesByTf[key])state.candlesByTf[key]={};
  try{
    const r=await fetch('https://api.binance.com/api/v3/klines?symbol='+s.binance+'&interval='+tf+'&limit=300');
    const data=await r.json();
    if(!Array.isArray(data))return;
    const candles=data.map(k=>({time:Math.floor(k[0]/1000),open:+k[1],high:+k[2],low:+k[3],close:+k[4]}));
    const vols=data.map(k=>({time:Math.floor(k[0]/1000),value:+k[5],color:+k[4]>=+k[1]?'rgba(0,230,118,.4)':'rgba(255,61,95,.4)'}));
    state.candlesByTf[key][tf]=data.map(k=>({t:k[0],o:+k[1],h:+k[2],l:+k[3],c:+k[4]}));
    state.candles[key]=state.candlesByTf[key][tf];
    state.prices[key]=+data[data.length-1][4];
    state.prev[key]=state.prices[key];
    if(key===state.focus&&tf===state.tf){
      candleSeries.setData(candles);volSeries.setData(vols);
      updateEMALines();
      chart.timeScale().fitContent();
      renderMarkers();
    }
    runFullAnalysis(key);
  }catch(e){console.error('load',key,tf,e);}
}
async function loadAllTFs(key){
  if(!state.candlesByTf[key])state.candlesByTf[key]={};
  for(const tf of ['1m','5m','15m','1h','4h']){
    if(tf===state.tf)continue;
    try{
      const r=await fetch('https://api.binance.com/api/v3/klines?symbol='+state.symbols[key].binance+'&interval='+tf+'&limit=200');
      const data=await r.json();
      if(Array.isArray(data))state.candlesByTf[key][tf]=data.map(k=>({t:k[0],o:+k[1],h:+k[2],l:+k[3],c:+k[4]}));
    }catch(e){}
  }
}

/* ============ EMA LINES ============ */
function updateEMALines(){
  const arr=state.candles[state.focus];if(!arr||arr.length<50)return;
  const closes=arr.map(c=>c.c);
  const e9d=[],e21d=[],e50d=[];
  for(let i=21;i<=arr.length;i++){
    const e9v=em(closes.slice(0,i),9),e21v=em(closes.slice(0,i),21),e50v=i>=50?em(closes.slice(0,i),50):null;
    const t=Math.floor(arr[i-1].t/1000);
    if(e9v)e9d.push({time:t,value:e9v});
    if(e21v)e21d.push({time:t,value:e21v});
    if(e50v)e50d.push({time:t,value:e50v});
  }
  ema9.setData(e9d);ema21.setData(e21d);ema50.setData(e50d);
}

/* ============ MARKERS ============ */
function renderMarkers(){
  const arr=state.markers.filter(m=>m.key===state.focus);
  if(!candleSeries)return;
  candleSeries.setMarkers(arr.map(m=>({time:m.time,position:m.dir==='buy'?'belowBar':'aboveBar',color:m.dir==='buy'?'#00e676':'#ff3d5f',shape:m.dir==='buy'?'arrowUp':'arrowDown',text:m.text})));
}
function addMarker(key,time,dir,text){state.markers.push({key,time:Math.floor(time/1000),dir,text});if(state.markers.length>100)state.markers.shift();if(key===state.focus)renderMarkers();}

/* ============ WEBSOCKETS ============ */
const sockets={};
function connectWS(key){
  const s=state.symbols[key];if(!s)return;
  if(sockets[key]){try{sockets[key].close();}catch(e){}}
  const w=new WebSocket('wss://stream.binance.com:9443/ws/'+s.binance.toLowerCase()+'@kline_'+state.tf);
  sockets[key]=w;
  w.onmessage=e=>{
    const d=JSON.parse(e.data).k,p=+d.c;
    state.prev[key]=state.prices[key]||p;state.prices[key]=p;
    if(key===state.focus){
      candleSeries.update({time:Math.floor(d.t/1000),open:+d.o,high:+d.h,low:+d.l,close:p});
      volSeries.update({time:Math.floor(d.t/1000),value:+d.v,color:p>=+d.o?'rgba(0,230,118,.4)':'rgba(255,61,95,.4)'});
    }
    const arr=state.candlesByTf[key]?.[state.tf]||[];
    const last=arr[arr.length-1];
    if(last&&last.t===d.t){last.h=+d.h;last.l=+d.l;last.c=p;}
    else{arr.push({t:d.t,o:+d.o,h:+d.h,l:+d.l,c:p});if(arr.length>300)arr.shift();runFullAnalysis(key);}
    tickers();ut();
  };
  w.onclose=()=>setTimeout(()=>connectWS(key),4000);
  w.onerror=()=>w.close();
}

/* ============ RENDER ============ */
function renderDecision(d){
  const ovl=document.getElementById('decOvl');
  ovl.className='ovl '+d.act;
  const ic=d.act==='buy'?'📈':d.act==='sell'?'📉':'⏸';
  const tx=d.act==='buy'?'ENTER — BUY':d.act==='sell'?'ENTER — SELL':'WAIT';
  const col=d.sc>=40?'#00e676':d.sc<=-40?'#ff3d5f':'#ffb300';
  document.getElementById('decIc').textContent=ic;
  document.getElementById('decT').textContent=d.label+' • '+d.tf;
  document.getElementById('decA').textContent=tx;
  document.getElementById('decW').innerHTML=d.why.slice(0,3).join(' • ')+'<br>'+d.ex;
  const r=document.getElementById('sRing');
  r.style.background='conic-gradient('+col+' '+d.str+'%, rgba(15,20,50,.9) 0)';
  r.querySelector('span').style.color=col;r.querySelector('span').textContent=d.str+'%';
  const wr=state.wins+state.losses>0?Math.round(state.wins/(state.wins+state.losses)*100):0;
  const cnt=d.mtfCounts||{buy:0,sell:0,wait:0};
  document.getElementById('decStats').innerHTML='Strength <b style="color:'+col+'">'+d.str+'%</b><br>MTF <b>'+cnt.buy+'B/'+cnt.sell+'S/'+cnt.wait+'W</b><br>WR <b>'+wr+'%</b> • Streak <b>'+state.streak+'</b>';
  const rev=document.getElementById('revAlert');
  const revPat=d.pats.find(p=>p.name.includes('Reversal'));
  if(revPat){rev.className='revAlert show';rev.innerHTML='⚠ <b>'+revPat.name+'</b> — trend change risk';}
  else{rev.className='revAlert';}
}
function renderHeaderBadge(d){
  const b=document.getElementById('hBadge');
  const confirmed=d.act!=='wait'&&d.str>=60;
  b.className='hBadge '+(confirmed?d.act:'wait');
  b.textContent=confirmed?(d.act==='buy'?'🟢 ENTER BUY':'🔴 ENTER SELL'):'⏸ WAIT';
}
function renderPatterns(d){
  const el=document.getElementById('patList');
  if(!d.pats||!d.pats.length){el.innerHTML='<div class="patRow"><span class="pdot neu"></span><span class="pname">Analyzing...</span></div>';return;}
  el.innerHTML=d.pats.map(p=>'<div class="patRow"><span class="pdot '+p.type+'"></span><span class="pname">'+p.name+'</span></div>').join('');
}
function renderLevels(d){
  document.getElementById('lvEntry').textContent=f(d.p);
  document.getElementById('lvEntryU').textContent='$'+f(POSITION,0);
  document.getElementById('lvEntryU').className='u';
  if(d.sl&&d.tp1&&d.tp2){
    const slU=usdPnl(d.p,d.sl),tp1U=usdPnl(d.p,d.tp1),tp2U=usdPnl(d.p,d.tp2);
    document.getElementById('lvSl').textContent=f(d.sl);

function ut(){
  let dirty=false;
  for(const t of state.trades){
    if(t.st!=='open')continue;
    const p=state.prices[t.key];if(!p)continue;
    /* USD pnl based on $1000 position */
    t.pnl=usdPnl(t.e,p);
    /* Check SL/TP - NO TIME BASED CLOSE */
    let c=false;
    if(t.dir==='buy'){
      if(p<=t.sl){t.st='loss';t.ep=p;t.er='SL';c=true;}
      else if(p>=t.tp){t.st='win';t.ep=p;t.er='TP';c=true;}
      /* Warn before TP */
      else if(!state.tpWarned[t.id]&&p>=t.tp*0.998){
        state.tpWarned[t.id]=true;
        speak('Warning. Price approaching take profit on '+t.symbol+'. Consider securing profits.');
      }
      /* Warn before SL */
      else if(!state.tpWarned[t.id+'_sl']&&p<=t.sl*1.002){
        state.tpWarned[t.id+'_sl']=true;
        speak('Alert. Price near stop loss on '+t.symbol+'.');
      }
    }else{
      if(p>=t.sl){t.st='loss';t.ep=p;t.er='SL';c=true;}
      else if(p<=t.tp){t.st='win';t.ep=p;t.er='TP';c=true;}
      else if(!state.tpWarned[t.id]&&p<=t.tp*1.002){
        state.tpWarned[t.id]=true;
        speak('Warning. Price approaching take profit on '+t.symbol+'.');
      }
      else if(!state.tpWarned[t.id+'_sl']&&p>=t.sl*0.998){
        state.tpWarned[t.id+'_sl']=true;
        speak('Alert. Price near stop loss on '+t.symbol+'.');
      }
    }
    if(c){
      t.ct=Date.now();state.bal+=t.pnl;
      if(!state.learned[t.pk])state.learned[t.pk]={w:0,l:0,tot:0};
      state.learned[t.pk].tot++;
      if(t.st==='win'){state.learned[t.pk].w++;state.wins++;state.streak=Math.max(1,state.streak+1);if(state.streak>state.bestStreak)state.bestStreak=state.streak;speak('Trade closed. Profit '+t.pnl.toFixed(2)+' dollars on '+t.symbol);}
      else{state.learned[t.pk].l++;state.losses++;state.streak=Math.min(-1,state.streak-1);speak('Trade closed. Loss '+Math.abs(t.pnl).toFixed(2)+' dollars on '+t.symbol);}
      saveS();
      addMarker(t.key,Date.now(),t.st==='win'?'buy':'sell',(t.st==='win'?'✔ TP ':'✘ SL ')+t.ep.toFixed(2));
    }
    dirty=true;
  }
  if(dirty){ub();const m=document.getElementById('modal');if(m.classList.contains('open')){const title=document.getElementById('mtitle').textContent;if(title.includes('Auto'))mAuto();else if(title.includes('Statistics'))mStats();}}
}

  const t=document.getElementById('mst');if(t)t.addEventListener('click',()=>{state.autoTrade=!state.autoTrade;mSettings();});
  const s=document.getElementById('mss');if(s)s.addEventListener('click',()=>{beep();speak('Voice test. Dark AI is speaking.');});
  const ft=document.getElementById('msf');if(ft)ft.addEventListener('click',()=>chart.timeScale().fitContent());
},100);}

/* ============ MENU ============ */
document.getElementById('m3').addEventListener('click',e=>{e.stopPropagation();document.getElementById('mn').classList.toggle('open');});
document.addEventListener('click',e=>{if(!e.target.closest('#mn')&&!e.target.closest('#m3'))document.getElementById('mn').classList.remove('open');});
document.getElementById('symBox').addEventListener('click',mSearch);
document.querySelectorAll('.mi').forEach(b=>b.addEventListener('click',()=>{document.getElementById('mn').classList.remove('open');const m=b.dataset.m;if(m==='search')mSearch();else if(m==='watch')mWatch();else if(m==='mtf')mMTF();else if(m==='auto')mAuto();else if(m==='signals')mSig();else if(m==='stats')mStats();else if(m==='chat')mChat();else if(m==='news')mNews();else if(m==='learn')mLearn();else if(m==='settings')mSettings();}));

/* ============ TF SWITCH ============ */
document.querySelectorAll('.tfb').forEach(b=>b.addEventListener('click',async()=>{
  document.querySelectorAll('.tfb').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  state.tf=b.dataset.tf;
  state.lastSignalTs={};
  for(const k in sockets){try{sockets[k].close();}catch(e){}}
  await loadSymbol(state.focus,state.tf);
  loadAllTFs(state.focus);
  connectWS(state.focus);
  for(const k of state.watchlist){loadAllTFs(k);connectWS(k);}
}));

/* ============ INIT ============ */
window.addEventListener('load',async()=>{
  initChart();
  await loadSymbol(state.focus,state.tf);
  await loadAllTFs(state.focus);
  connectWS(state.focus);
  for(const k of state.watchlist){
    loadSymbol(k,state.tf);
    loadAllTFs(k);
    connectWS(k);
  }
  ub();tickers();renderWL();
  setInterval(tickers,500);
  setInterval(ub,1000);
  setInterval(()=>{const d=state.decisions[state.focus];if(d)renderDecision(d);},2000);
  /* Greet */
  setTimeout(()=>speak('Dark AI ready. Monitoring '+state.watchlist.length+' symbols.'),1500);
});
console.log('%c⚡ DARK AI v5 Pro ready','color:#00d4ff;font-size:16px;font-weight:bold');
</script>
