<style>

.ci{display:flex;gap:8px;margin-top:12px}
.ci textarea{flex:1;background:rgba(15,20,36,.9);border:1px solid var(--bd);border-radius:11px;padding:10px;color:var(--fg);font-family:inherit;font-size:13px;resize:none;min-height:44px;max-height:100px;outline:none}
.ci textarea:focus{border-color:var(--ac)}
.sbtn{background:var(--gr);color:#fff;border:none;width:46px;border-radius:11px;cursor:pointer;font-size:18px}
.tp{display:inline-flex;gap:3px}
.tp span{width:6px;height:6px;border-radius:50%;background:var(--ac);animation:bo 1.2s infinite}
.tp span:nth-child(2){animation-delay:.15s;background:var(--ac2)}
.tp span:nth-child(3){animation-delay:.3s;background:#f472b6}
@keyframes bo{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-6px);opacity:1}}
.ni{padding:10px 12px;border-radius:10px;background:rgba(15,20,36,.7);border:1px solid var(--bd);font-size:12px;margin-bottom:8px}
.ni .src{font-size:10px;color:var(--mu);margin-top:4px}
.imp{display:inline-block;padding:2px 8px;border-radius:999px;font-size:10px;font-weight:800;margin-left:6px}
.imp.high{background:rgba(255,61,95,.2);color:var(--er)}
.imp.med{background:rgba(255,179,0,.2);color:var(--wr)}
.imp.low{background:rgba(0,230,118,.2);color:var(--ok)}
.mn{position:fixed;top:64px;right:16px;background:rgba(15,20,36,.98);backdrop-filter:blur(24px);border:1px solid var(--bd);border-radius:16px;padding:8px;min-width:220px;z-index:150;display:none;box-shadow:0 12px 40px rgba(0,0,0,.7)}
.mn.open{display:block}
.mi{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;color:var(--fg);cursor:pointer;font-size:13px;font-weight:700;background:transparent;border:none;width:100%;font-family:inherit;text-align:left}
.mi:hover{background:var(--bg3);color:var(--ac)}
.mi .ico{font-size:16px;width:20px;text-align:center}
.msep{height:1px;background:var(--bd);margin:6px 8px}
.badge{background:var(--er);color:#fff;font-size:10px;font-weight:900;padding:2px 6px;border-radius:999px;margin-left:auto}
#learn{background:linear-gradient(135deg,rgba(0,230,118,.15),rgba(0,212,255,.1));border:1px solid rgba(0,230,118,.4);border-radius:12px;padding:12px;margin-bottom:14px;font-size:12px}
#learn b{color:var(--ok)}

<script>
const S={pr:{GOLD:0,BTC:0},pv:{GOLD:0,BTC:0},cd:{GOLD:[],BTC:[]},sg:[],dc:[],tr:[],bal:10000,at:false,as:'GOLD',atv:'OANDA:XAUUSD',lt:{GOLD:0,BTC:0},learned:{},wins:0,losses:0,streak:0,bestStreak:0};
const CM=60000,TD=180000;

/* ---------- LEARNED PATTERNS (localStorage) ---------- */
try{const l=localStorage.getItem('darkai_learn');if(l)S.learned=JSON.parse(l);}catch(e){}
function saveLearn(){try{localStorage.setItem('darkai_learn',JSON.stringify(S.learned));}catch(e){}}
function patternKey(d){return (d.e9>d.e21?'up':'down')+'_'+(d.r<35?'os':d.r>65?'ob':'mid')+'_'+(d.m.hist>0?'mp':'mn');}

/* ---------- PRICE FEED ---------- */
function feed(sym,k){const w=new WebSocket('wss://stream.binance.com:9443/ws/'+sym.toLowerCase()+'@trade');w.onmessage=e=>{const d=JSON.parse(e.data);const p=parseFloat(d.p);S.pv[k]=S.pr[k]||p;S.pr[k]=p;uc(k,p,Date.now());tt();ut();};w.onclose=()=>setTimeout(()=>feed(sym,k),3000);w.onerror=()=>w.close();}
function uc(k,p,ts){const a=S.cd[k];const l=a[a.length-1];if(!l||ts-l.t>=CM){a.push({t:ts,o:p,h:p,l:p,c:p});if(a.length>100)a.shift();an(k);}else{l.h=Math.max(l.h,p);l.l=Math.min(l.l,p);l.c=p;}}
feed('BTCUSDT','BTC');feed('PAXGUSDT','GOLD');

/* ---------- INDICATORS ---------- */
function em(a,p){if(a.length<p)return null;const k=2/(p+1);let e=a.slice(0,p).reduce((x,y)=>x+y,0)/p;for(let i=p;i<a.length;i++)e=a[i]*k+e*(1-k);return e;}
function rs(c,p){p=p||14;if(c.length<p+1)return null;let g=0,l=0;for(let i=c.length-p;i<c.length;i++){const d=c[i]-c[i-1];if(d>=0)g+=d;else l-=d;}return 100-100/(1+(g/(l||1e-4)));}
function mc(c){if(c.length<26)return null;const e12=em(c,12),e26=em(c,26);if(!e12||!e26)return null;const l=e12-e26;const h=[];for(let i=26;i<=c.length;i++){const a=em(c.slice(0,i),12);const b=em(c.slice(0,i),26);if(a&&b)h.push(a-b);}const s=em(h.slice(-30),9);return{hist:l-(s||l)};}
function bl(c){if(c.length<20)return null;const s=c.slice(-20);const m=s.reduce((a,b)=>a+b,0)/20;const v=s.reduce((a,b)=>a+(b-m)*(b-m),0)/20;const d=Math.sqrt(v);return{u:m+2*d,m,l:m-2*d};}
function at(a){if(a.length<2)return null;const s=a.slice(-14);return Math.max(...s.map(c=>c.h))-Math.min(...s.map(c=>c.l));}
function sr(a){if(a.length<10)return null;const s=a.slice(-30);const h=s.map(c=>c.h).sort((x,y)=>y-x);const l=s.map(c=>c.l).sort((x,y)=>x-y);return{r:h.slice(0,3).reduce((x,y)=>x+y,0)/3,s:l.slice(0,3).reduce((x,y)=>x+y,0)/3};}

/* ---------- ANALYSIS + LEARNING ---------- */
function an(k){
const a=S.cd[k];if(a.length<30)return;const c=a.map(x=>x.c),p=S.pr[k];
const e9=em(c,9),e21=em(c,21),e50=em(c,50),r=rs(c,14),m=mc(c),b=bl(c),aT=at(a),s=sr(a);
if(!e9||!e21||!r||!m||!b||!aT)return;
let sc=0;const why=[];
if(e9>e21){sc+=20;why.push('EMA9>EMA21');}else{sc-=20;why.push('EMA9<EMA21');}
if(e50){if(p>e50){sc+=10;why.push('Above EMA50');}else{sc-=10;why.push('Below EMA50');}}
if(r<30){sc+=25;why.push('RSI oversold '+r.toFixed(0));}else if(r>70){sc-=25;why.push('RSI overbought '+r.toFixed(0));}
if(m.hist>0){sc+=15;why.push('MACD+');}else{sc-=15;why.push('MACD-');}
if(p<b.l){sc+=20;why.push('Below BB');}else if(p>b.u){sc-=20;why.push('Above BB');}
/* LEARNING ADJUSTMENT */
const pk=(e9>e21?'up':'down')+'_'+(r<35?'os':r>65?'ob':'mid')+'_'+(m.hist>0?'mp':'mn');
const lr=S.learned[pk];
if(lr&&lr.tot>=5){const wr=lr.w/lr.tot;if(wr>0.6){sc=Math.round(sc*1.15);why.push('AI learned: this pattern wins '+Math.round(wr*100)+'%');}else if(wr<0.4){sc=Math.round(sc*0.85);why.push('AI warns: pattern only '+Math.round(wr*100)+'%');}}
let act='wait',dir=null;
if(sc>=40){act='buy';dir='buy';}else if(sc<=-40){act='sell';dir='sell';}
const sd=aT*0.9,t1=aT*1.2,t2=aT*2.2;let sl=null,tp1=null,tp2=null,ex='';
if(dir==='buy'){sl=p-sd;tp1=p+t1;tp2=p+t2;ex='Exit below '+sl.toFixed(2);}
else if(dir==='sell'){sl=p+sd;tp1=p-t1;tp2=p-t2;ex='Exit above '+sl.toFixed(2);}
else{ex='Wait break '+(s?s.r.toFixed(2):'?')+' / '+(s?s.s.toFixed(2):'?');}
const d={key:k,symbol:k==='GOLD'?'XAUUSD':'BTCUSDT',act,dir,p,sl,tp1,tp2,str:Math.min(100,Math.abs(sc)+40),sc,why,ex,ts:Date.now(),e9,e21,e50,r,m,b,s,pk};
S.dc.unshift(d);if(S.dc.length>60)S.dc.pop();
if(act!=='wait'&&Date.now()-(S.lt[k]||0)>60000){S.lt[k]=Date.now();S.sg.unshift(d);if(S.sg.length>40)S.sg.pop();pl();if(S.at)ot(d);}
ra();drawOverlay();
}

/* ---------- AUTO TRADE ---------- */
function ot(d){S.tr.unshift({id:Date.now()+Math.random(),symbol:d.symbol,key:d.key,dir:d.dir,e:d.p,sl:d.sl,tp:d.tp1,sz:.01,ot:Date.now(),dur:TD,st:'open',pnl:0,ep:null,er:null,pk:d.pk});if(S.tr.length>100)S.tr.pop();}
function ut(){let dirty=false;for(let i=0;i<S.tr.length;i++){const t=S.tr[i];if(t.st!=='open')continue;const p=S.pr[t.key];if(!p)continue;const df=t.dir==='buy'?p-t.e:t.e-p;t.pnl=df*t.sz*100;const el=Date.now()-t.ot;let c=false;if(t.dir==='buy'){if(p<=t.sl){t.st='loss';t.ep=p;t.er='SL';c=true;}else if(p>=t.tp){t.st='win';t.ep=p;t.er='TP';c=true;}}else{if(p>=t.sl){t.st='loss';t.ep=p;t.er='SL';c=true;}else if(p<=t.tp){t.st='win';t.ep=p;t.er='TP';c=true;}}if(!c&&el>=t.dur){t.st=t.pnl>=0?'win':'loss';t.ep=p;t.er='Time 3min';c=true;}if(c){t.ct=Date.now();S.bal+=t.pnl;/* LEARN */
if(!S.learned[t.pk])S.learned[t.pk]={w:0,l:0,tot:0};
S.learned[t.pk].tot++;if(t.st==='win'){S.learned[t.pk].w++;S.wins++;S.streak=Math.max(1,S.streak+1);if(S.streak>S.bestStreak)S.bestStreak=S.streak;}else{S.learned[t.pk].l++;S.losses++;S.streak=Math.min(-1,S.streak-1);}
saveLearn();}dirty=true;}if(dirty){rt();rst();ub();}}
}

/* ---------- UI ---------- */
function f(n,d){d=d===undefined?2:d;return Number(n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});}
function ft(ms){const s=Math.max(0,Math.floor(ms/1000));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
function tt(){const g=S.pr.GOLD,b=S.pr.BTC;document.getElementById('pg').textContent=g?'$'+f(g):'—';document.getElementById('pb').textContent=b?'$'+f(b):'—';const gp=S.pv.GOLD||g,bp=S.pv.BTC||b;const gc=gp?((g-gp)/gp)*100:0,bc=bp?((b-bp)/bp)*100:0;const cg=document.getElementById('cg'),cb=document.getElementById('cb');cg.textContent=(gc>=0?'+':'')+gc.toFixed(2)+'%';cg.className=gc>=0?'up':'dn';cb.textContent=(bc>=0?'+':'')+bc.toFixed(2)+'%';cb.className=bc>=0?'up':'dn';}
function ub(){document.getElementById('bal').textContent='$'+f(S.bal);const pnl=S.bal-10000;const pct=(pnl/10000)*100;const e=document.getElementById('bpl');e.textContent=(pnl>=0?'+':'')+'$'+f(Math.abs(pnl))+' ('+(pnl>=0?'+':'')+pct.toFixed(2)+'%)';e.className='bpl '+(pnl>=0?'p':'n');}
function rsp(){const d=S.dc.find(x=>x.key===S.as);const p=document.getElementById('signalPanel');if(!d){p.className='wait';document.getElementById('spa').textContent='Collecting candles...';return;}const ic=d.act==='buy'?'📈':d.act==='sell'?'📉':'⏸';const tx=d.act==='buy'?'ENTER NOW — BUY':d.act==='sell'?'ENTER NOW — SELL':'WAIT';const col=d.sc>=40?'#00e676':d.sc<=-40?'#ff3d5f':'#ffb300';p.className=d.act;document.getElementById('spic').textContent=ic;document.getElementById('spt').textContent=d.symbol+' • LIVE';document.getElementById('spa').textContent=tx;document.getElementById('spwhy').textContent=d.why.slice(0,3).join(' • ');const r=document.getElementById('spr');r.style.background='conic-gradient('+col+' '+d.str+'%, rgba(15,20,36,.9) 0)';r.querySelector('span').style.color=col;r.querySelector('span').textContent=d.str+'%';const wr=S.wins+S.losses>0?Math.round(S.wins/(S.wins+S.losses)*100):0;document.getElementById('sps').innerHTML='Strength: <b>'+d.str+'%</b><br>Win Rate: <b>'+wr+'%</b><br>Streak: <b>'+S.streak+'</b>';}

/* ---------- OVERLAY (Entry/SL/TP lines) ---------- */
function drawOverlay(){
const ov=document.getElementById('overlay');
const d=S.dc.find(x=>x.key===S.as);
if(!d||!d.sl){ov.innerHTML='';return;}
const pr=S.pr[S.as];if(!pr)return;
const range=(d.e9&&d.e21)?Math.abs(d.tp2-d.sl):null;
if(!range)return;
/* compute approximate Y position using ATR range */
const widgetH=ov.clientHeight;
const topP=d.tp2+ (range*0.1);
const botP=d.sl-(range*0.1);
const total=topP-botP;
if(total<=0){ov.innerHTML='';return;}
const yOf=p=>((topP-p)/total)*widgetH;
const colors={entry:'ac',sl:'er',tp:'ok',tp2:'gd'};
const prices=[{k:'entry',v:d.p,label:'ENTRY'},{k:'sl',v:d.sl,label:'SL'},{k:'tp',v:d.tp1,label:'TP1'},{k:'tp2',v:d.tp2,label:'TP2'}];
let html='';
for(const it of prices){
  const y=yOf(it.v);
  if(y<0||y>widgetH)continue;
  const cls=it.k==='tp2'?'tp2':it.k;
  html+='<div class="hline '+cls+'" style="top:'+y+'px"></div>';
  html+='<div class="lvlBadge '+cls+'" style="top:'+(y-10)+'px">'+it.label+' '+f(it.v)+'</div>';
}
ov.innerHTML=html;
}

/* ---------- MODALS ---------- */
function openModal(title,html){document.getElementById('mtitle').textContent=title;document.getElementById('mbody').innerHTML=html;document.getElementById('modal').classList.add('open');}
document.getElementById('mclose').addEventListener('click',()=>document.getElementById('modal').classList.remove('open'));
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')document.getElementById('modal').classList.remove('open');});

function mLive(){const d=S.dc.find(x=>x.key===S.as);if(!d){openModal('Live Analysis','<div class="ni">Loading...</div>');return;}const lv=d.sl?'<div class="st"><span>Entry</span><b style="color:var(--ac)">'+f(d.p)+'</b></div><div class="st"><span>Stop Loss</span><b style="color:var(--er)">'+f(d.sl)+'</b></div><div class="st"><span>TP1</span><b style="color:var(--ok)">'+f(d.tp1)+'</b></div><div class="st"><span>TP2</span><b style="color:var(--gd)">'+f(d.tp2)+'</b></div>':'<div class="ni">No active signal — waiting for conditions.</div>';openModal('📊 Live Analysis — '+d.symbol,'<div class="ct">Decision</div><div class="ni"><b style="font-size:16px">'+d.act.toUpperCase()+'</b> • Strength '+d.str+'%<br><br>'+d.why.join('<br>')+'</div><div class="ct">Levels</div>'+lv+'<div class="ct">Indicators</div><div class="st"><span>EMA9 / EMA21</span><b>'+f(d.e9)+' / '+f(d.e21)+'</b></div><div class="st"><span>RSI</span><b>'+d.r.toFixed(1)+'</b></div><div class="st"><span>MACD</span><b>'+d.m.hist.toFixed(2)+'</b></div><div class="st"><span>Support</span><b style="color:var(--ok)">'+f(d.s.s)+'</b></div><div class="st"><span>Resistance</span><b style="color:var(--er)">'+f(d.s.r)+'</b></div>');}

function mAuto(){const list=S.tr.length?S.tr.slice(0,30).map(t=>{const c=t.st==='open'?'open':t.st==='win'?'win':'loss';const pc=t.pnl>=0?'p':'n';const lb=t.st==='open'?'OPEN':t.st==='win'?'WIN ✅':'LOSS ❌';const rm=t.st==='open'?Math.max(0,t.dur-(Date.now()-t.ot)):0;return '<div class="tr '+c+'"><div style="flex:1"><b>'+t.symbol+' '+t.dir.toUpperCase()+'</b><div class="sgm">E '+f(t.e)+' • SL '+f(t.sl)+' • TP '+f(t.tp)+'</div>'+(t.st==='open'?'<div class="tt">⏱ '+ft(rm)+' left</div>':'<div class="sgm">'+t.er+'</div>')+'</div><div class="tpnl '+pc+'">'+(t.pnl>=0?'+':'')+'$'+f(t.pnl)+'<div class="sgm">'+lb+'</div></div></div>';}).join(''):'<div class="ni">No trades yet.</div>';openModal('⚡ Auto Trade','<div class="ct">Balance: <span style="color:var(--ac)">$'+f(S.bal)+'</span></div><div style="margin-bottom:14px"><button class="tg '+(S.at?'on':'')+'" id="mat">'+(S.at?'Stop Auto Trade':'Start Auto Trade')+'</button><button class="tg" id="mrb">Reset Balance</button><button class="tg" id="mclear">Clear Trades</button></div><div class="ct">Trades</div><div class="lst">'+list+'</div>');setTimeout(()=>{const a=document.getElementById('mat');if(a)a.addEventListener('click',()=>{S.at=!S.at;a.className='tg '+(S.at?'on':'');a.textContent=S.at?'Stop Auto Trade':'Start Auto Trade';});const r=document.getElementById('mrb');if(r)r.addEventListener('click',()=>{if(confirm('Reset?')){S.bal=10000;S.tr=[];S.wins=0;S.losses=0;S.streak=0;ub();mAuto();}});const cl=document.getElementById('mclear');if(cl)cl.addEventListener('click',()=>{S.tr=[];mAuto();});},100);}

function mSig(){const list=S.sg.length?S.sg.slice(0,40).map(s=>'<div class="sg '+s.dir+'"><div class="sgh"><span>'+s.symbol+'</span><span class="bdg '+s.dir+'">'+s.dir.toUpperCase()+'</span></div><div class="sgm">Entry '+f(s.p)+' • SL '+f(s.sl)+' • TP '+f(s.tp1)+'</div><div class="sgm" style="margin-top:4px">Strength '+s.str+'% • '+new Date(s.ts).toLocaleTimeString()+'</div></div>').join(''):'<div class="ni">No signals yet.</div>';openModal('🎯 Signals History','<div class="lst">'+list+'</div>');}

function mStats(){const closed=S.tr.filter(t=>t.st!=='open');const w=closed.filter(t=>t.st==='win').length;const l=closed.filter(t=>t.st==='loss').length;const o=S.tr.filter(t=>t.st==='open').length;const tp=closed.reduce((a,t)=>a+t.pnl,0);const wr=closed.length?Math.round(w/closed.length*100):0;const best=closed.length?Math.max(...closed.map(t=>t.pnl)):0;const worst=closed.length?Math.min(...closed.map(t=>t.pnl)):0;openModal('📈 Statistics','<div class="st"><span>Total P&L</span><b style="color:var(--'+(tp>=0?'ok':'er')+')">'+(tp>=0?'+':'')+'$'+f(tp)+'</b></div><div class="st"><span>Closed</span><b>'+closed.length+'</b></div><div class="st"><span style="color:var(--ok)">Wins</span><b style="color:var(--ok)">'+w+'</b></div><div class="st"><span style="color:var(--er)">Losses</span><b style="color:var(--er)">'+l+'</b></div><div class="st"><span style="color:var(--wr)">Open</span><b style="color:var(--wr)">'+o+'</b></div><div class="st"><span>Win Rate</span><b style="color:var(--ac)">'+wr+'%</b></div><div class="st"><span>Best Trade</span><b style="color:var(--ok)">+$'+f(best)+'</b></div><div class="st"><span>Worst Trade</span><b style="color:var(--er)">$'+f(worst)+'</b></div><div class="st"><span>Current Streak</span><b>'+S.streak+'</b></div><div class="st"><span>Best Streak</span><b style="color:var(--gd)">'+S.bestStreak+'</b></div>');}

function mChat(){openModal('💬 AI Chat','<div class="chat" id="mchb"><div class="msg a">👋 Ask about any market. Example: <code>Analyze gold</code></div></div><div class="ci"><textarea id="mci" placeholder="Ask..." rows="1"></textarea><button class="sbtn" id="msb">➤</button></div>');setTimeout(()=>{const i=document.getElementById('mci'),b=document.getElementById('msb');b.addEventListener('click',()=>{const v=i.value.trim();if(!v)return;i.value='';aAI(v);});i.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();b.click();}});},100);}

const SYS='You are DARK AI — professional trading assistant. Answer briefly in English. For any market: direction, entry, SL, TP1, TP2, confidence %. Educational only.';
async function aAI(t){const b=document.getElementById('mchb');if(!b)return;const u=document.createElement('div');u.className='msg u';u.textContent=t;b.appendChild(u);const th=document.createElement('div');th.className='msg a';th.innerHTML='<div class="tp"><span></span><span></span><span></span></div>';b.appendChild(th);b.scrollTop=b.scrollHeight;const cur=S.dc.find(d=>d.key===S.as);const ctx='\nGOLD '+S.pr.GOLD.toFixed(2)+' BTC '+S.pr.BTC.toFixed(2)+' Active '+S.as+' Last '+(cur?cur.act:'none');try{const r=await puter.ai.chat(SYS+ctx+'\nQ: '+t);const tx=r&&r.message&&r.message.content?r.message.content:(r&&r.text?r.text:String(r));th.innerHTML=fAI(tx);}catch(e){th.innerHTML='⚠️ '+e.message;}b.scrollTop=b.scrollHeight;}
function fAI(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\n/g,'<br>');}

async function mNews(){openModal('📰 News Analysis','<div class="ni">🧠 Analyzing...</div>');try{const p='5 recent events affecting gold & bitcoin. JSON only: {"items":[{"title":"","source":"","impact":"high|med|low","gold":"","btc":""}]}';const r=await puter.ai.chat(p);const tx=r&&r.message&&r.message.content?r.message.content:(r&&r.text?r.text:String(r));const m=tx.match(/\{[\s\S]*\}/);if(m){const d=JSON.parse(m[0]);document.getElementById('mbody').innerHTML=d.items.map(n=>'<div class="ni"><b>'+n.title+'</b><span class="imp '+(n.impact==='high'?'high':n.impact==='med'?'med':'low')+'">'+n.impact.toUpperCase()+'</span><div style="margin-top:6px">🥇 GOLD: '+n.gold+'</div><div>₿ BTC: '+n.btc+'</div><div class="src">📰 '+n.source+'</div></div>').join('');}else{document.getElementById('mbody').innerHTML='<div class="ni">'+fAI(tx)+'</div>';}}catch(e){document.getElementById('mbody').innerHTML='<div class="ni">⚠️ '+e.message+'</div>';}}

function mLearn(){const keys=Object.keys(S.learned).sort((a,b)=>S.learned[b].tot-S.learned[a].tot);const rows=keys.length?keys.map(k=>{const l=S.learned[k];const wr=Math.round(l.w/l.tot*100);return '<div class="st"><span>'+k+'</span><b style="color:'+(wr>55?'var(--ok)':wr<45?'var(--er)':'var(--wr)')+'">'+wr+'% ('+l.w+'/'+l.tot+')</b></div>';}).join(''):'<div class="ni">No learning data yet. Start Auto Trade to collect patterns.</div>';const total=S.wins+S.losses;const gwr=total?Math.round(S.wins/total*100):0;openModal('🧠 AI Learning','<div id="learn"><b>Total Patterns Learned:</b> '+keys.length+'<br><b>Overall Win Rate:</b> '+gwr+'% ('+S.wins+'/'+total+')<br><b>Best Streak:</b> '+S.bestStreak+'</div><div class="ct">Pattern Performance</div>'+rows+'<div style="margin-top:14px"><button class="tg" id="mreset">🗑 Reset Learning Data</button></div>');setTimeout(()=>{const r=document.getElementById('mreset');if(r)r.addEventListener('click',()=>{if(confirm('Reset all learned patterns?')){S.learned={};S.wins=0;S.losses=0;S.streak=0;S.bestStreak=0;saveLearn();mLearn();}});},100);}

function mSettings(){openModal('⚙️ Settings','<div class="st"><span>Trade Duration</span><b>'+Math.round(TD/60000)+' min</b></div><div class="st"><span>Candle Interval</span><b>'+Math.round(CM/1000)+'s</b></div><div class="st"><span>Signal Cooldown</span><b>60s</b></div><div class="st"><span>Auto Trade</span><b style="color:var(--'+(S.at?'ok':'er')+')">'+(S.at?'ON':'OFF')+'</b></div><div style="margin-top:14px"><button class="tg" id="mtog">'+(S.at?'Disable':'Enable')+' Auto Trade</button><button class="tg" id="msnd">Test Sound</button></div><div class="ct" style="margin-top:20px">About</div><div class="ni">DARK AI v1 — Full Trading Platform<br>Live Binance feed • TradingView charts • Puter.js AI • Adaptive learning</div>');setTimeout(()=>{const t=document.getElementById('mtog');if(t)t.addEventListener('click',()=>{S.at=!S.at;mSettings();});const s=document.getElementById('msnd');if(s)s.addEventListener('click',pl);},100);}

/* ---------- MENU ---------- */
document.getElementById('m3').addEventListener('click',e=>{e.stopPropagation();document.getElementById('mn').classList.toggle('open');});
document.addEventListener('click',e=>{if(!e.target.closest('#mn')&&!e.target.closest('#m3'))document.getElementById('mn').classList.remove('open');});
document.querySelectorAll('.mi').forEach(b=>b.addEventListener('click',()=>{document.getElementById('mn').classList.remove('open');const m=b.dataset.m;if(m==='live')mLive();else if(m==='auto')mAuto();else if(m==='signals')mSig();else if(m==='stats')mStats();else if(m==='chat')mChat();else if(m==='news')mNews();else if(m==='learn')mLearn();else if(m==='settings')mSettings();}));

/* ---------- SYMBOL SWITCH ---------- */
document.querySelectorAll('.sb').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.sb').forEach(x=>x.classList.remove('active'));b.classList.add('active');S.atv=b.dataset.s;S.as=b.dataset.s.includes('XAU')?'GOLD':b.dataset.s.includes('BTC')?'BTC':'GOLD';ltv(b.dataset.s);rsp();drawOverlay();}));

/* ---------- TRADINGVIEW ---------- */
let wg=null;
function ltv(sym){const c=document.getElementById('chart');c.innerHTML='';if(wg){try{wg.remove();}catch(e){}wg=null;}wg=new TradingView.widget({container_id:'chart',autosize:true,symbol:sym,interval:'5',timezone:'Etc/UTC',theme:'dark',style:'1',locale:'en',toolbar_bg:'#0f1424',enable_publishing:false,allow_symbol_change:true,hide_side_toolbar:false,withdateranges:true,studies:['RSI@tv-basicstudies','MASimple@tv-basicstudies','MACD@tv-basicstudies'],overrides:{'paneProperties.background':'#0a0e1a','mainSeriesProperties.candleStyle.upColor':'#00e676','mainSeriesProperties.candleStyle.downColor':'#ff3d5f','mainSeriesProperties.candleStyle.borderUpColor':'#00e676','mainSeriesProperties.candleStyle.borderDownColor':'#ff3d5f','mainSeriesProperties.candleStyle.wickUpColor':'#00e676','mainSeriesProperties.candleStyle.wickDownColor':'#ff3d5f'}});}

/* ---------- SOUND ---------- */
function pl(){try{const c=new (window.AudioContext||window.webkitAudioContext)();const o=c.createOscillator();const g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.setValueAtTime(880,c.currentTime);o.frequency.exponentialRampToValueAtTime(1320,c.currentTime+.15);g.gain.setValueAtTime(.0001,c.currentTime);g.gain.exponentialRampToValueAtTime(.2,c.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+.35);o.start();o.stop(c.currentTime+.35);}catch(e){}}

/* ---------- MAIN LOOP ---------- */
function ra(){rsp();if(document.getElementById('modal').classList.contains('open')){const t=document.getElementById('mtitle').textContent;if(t.includes('Auto Trade'))mAuto();else if(t.includes('Statistics'))mStats();}}
ub();rsp();ltv(S.atv);
setInterval(tt,400);setInterval(rsp,1500);setInterval(ub,1000);setInterval(drawOverlay,800);
window.addEventListener('resize',()=>setTimeout(drawOverlay,300));
console.log('%c⚡ DARK AI ready','color:#00d4ff;font-size:16px;font-weight:bold');
</script>
