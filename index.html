*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;font-size:14px;color:#eaf0ff;background:#0a1230}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 10% 0%,rgba(0,180,255,.28),transparent 50%),radial-gradient(ellipse at 90% 100%,rgba(160,80,255,.3),transparent 50%),radial-gradient(circle at 50% 50%,rgba(0,230,180,.12),transparent 60%),linear-gradient(135deg,#0a1230 0%,#141a3e 50%,#1a1450 100%);z-index:-2}

.lt{background:linear-gradient(135deg,#00d4ff,#a855f7,#f472b6,#00d4ff);background-size:300% auto;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:txt 5s linear infinite}

.wl{display:flex;gap:6px;flex:1;justify-content:center;flex-wrap:wrap}

.wt:hover{border-color:#00d4ff;transform:translateY(-1px)}

.wt b{color:#9aa4cc;font-family:monospace}
.wt .chg{font-size:10px}

.bbal{display:flex;flex-direction:column;align-items:flex-end;font-size:10px;color:#9aa4cc;font-weight:700;flex-shrink:0}

.bpl{font-size:11px;font-family:monospace;font-weight:800;margin-top:2px}
.bpl.p{color:#00e676;text-shadow:0 0 10px rgba(0,230,118,.6)}
.bpl.n{color:#ff3d5f;text-shadow:0 0 10px rgba(255,61,95,.6)}
.menu3{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,rgba(0,212,255,.15),rgba(124,58,237,.15));border:1px solid rgba(0,212,255,.4);color:#00d4ff;cursor:pointer;font-size:20px;font-weight:900;display:flex;align-items:center;justify-content:center;font-family:inherit;flex-shrink:0;transition:all .3s;backdrop-filter:blur(10px)}
.menu3:hover{background:linear-gradient(135deg,#00d4ff,#7c3aed);color:#fff;border-color:transparent;box-shadow:0 0 28px rgba(0,212,255,.6)}
main{position:fixed;top:62px;left:0;right:0;bottom:0;display:flex}
#side{width:340px;flex-shrink:0;background:linear-gradient(180deg,rgba(10,18,48,.9),rgba(20,26,62,.75));backdrop-filter:blur(24px);border-right:1px solid rgba(0,212,255,.25);padding:16px;display:flex;flex-direction:column;gap:14px;overflow-y:auto;box-shadow:4px 0 30px rgba(0,0,0,.3)}
#side::-webkit-scrollbar{width:6px}
#side::-webkit-scrollbar-thumb{background:rgba(0,212,255,.3);border-radius:3px}
@media(max-width:900px){main{flex-direction:column}#side{width:100%;max-height:40vh;border-right:none;border-bottom:1px solid rgba(0,212,255,.25)}}
.sec{background:linear-gradient(135deg,rgba(15,20,50,.7),rgba(25,30,70,.5));border:1px solid rgba(0,212,255,.25);border-radius:14px;padding:14px;position:relative;overflow:hidden}
.sec.buy{border-color:rgba(0,230,118,.5);box-shadow:0 0 30px rgba(0,230,118,.2)}
.sec.sell{border-color:rgba(255,61,95,.5);box-shadow:0 0 30px rgba(255,61,95,.2)}
.sec.wait{border-color:rgba(255,179,0,.4);box-shadow:0 0 30px rgba(255,179,0,.15)}
.shead{display:flex;align-items:center;gap:12px}
.sic{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,#00d4ff,#7c3aed);display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0;box-shadow:0 8px 24px rgba(0,212,255,.4)}
.sec.buy .sic{background:linear-gradient(135deg,#00e676,#00d4ff);box-shadow:0 8px 24px rgba(0,230,118,.5)}
.sec.sell .sic{background:linear-gradient(135deg,#ff3d5f,#f472b6);box-shadow:0 8px 24px rgba(255,61,95,.5)}
.sec.wait .sic{background:linear-gradient(135deg,#ffb300,#ffd54f);box-shadow:0 8px 24px rgba(255,179,0,.5)}
.stl{font-size:10px;color:#9aa4cc;font-weight:800;letter-spacing:2px;text-transform:uppercase}
.sav{font-size:20px;font-weight:900;line-height:1.15;margin-top:2px}
.sec.buy .sav{color:#00e676;text-shadow:0 0 20px rgba(0,230,118,.4)}
.sec.sell .sav{color:#ff3d5f;text-shadow:0 0 20px rgba(255,61,95,.4)}
.sec.wait .sav{color:#ffb300;text-shadow:0 0 20px rgba(255,179,0,.4)}
.swhy{font-size:11px;color:#9aa4cc;line-height:1.5;margin-top:8px}
.strengthRow{display:flex;align-items:center;gap:12px;margin-top:12px;padding-top:12px;border-top:1px solid rgba(0,212,255,.15)}
.sring{width:62px;height:62px;border-radius:50%;position:relative;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px;font-family:monospace;flex-shrink:0}
.sring::after{content:'';position:absolute;inset:5px;border-radius:50%;background:#0a1230}
.sring span{position:relative;z-index:2}
.sstat{font-size:11px;color:#9aa4cc;line-height:1.6}
.sstat b{color:#eaf0ff}
.tfRow{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.tfb{padding:7px 4px;background:rgba(15,20,50,.7);border:1px solid rgba(0,212,255,.25);color:#9aa4cc;border-radius:8px;font-weight:800;font-size:11px;cursor:pointer;font-family:inherit;transition:all .25s;text-transform:uppercase}
.tfb:hover{border-color:#00d4ff;color:#00d4ff}
.tfb.active{background:linear-gradient(135deg,#00d4ff,#7c3aed);color:#fff;border-color:transparent;box-shadow:0 4px 16px rgba(0,212,255,.4)}
.lvlMini{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lmBox{background:rgba(15,20,50,.6);border:1px solid rgba(0,212,255,.2);border-radius:10px;padding:9px 10px;transition:all .2s}
.lmBox:hover{border-color:#00d4ff;transform:translateY(-1px)}
.lmBox .k{font-size:9px;color:#9aa4cc;font-weight:800;letter-spacing:1px;text-transform:uppercase}
.lmBox .v{font-size:13px;font-weight:900;font-family:monospace;margin-top:3px}
.lmBox.e .v{color:#00d4ff}.lmBox.s .v{color:#ff3d5f}.lmBox.t1 .v{color:#00e676}.lmBox.t2 .v{color:#ffd54f}
#chartWrap{flex:1;position:relative;overflow:hidden}
#chart{width:100%;height:100%}
.toast{position:absolute;top:16px;right:16px;background:linear-gradient(135deg,rgba(0,230,118,.95),rgba(0,212,255,.9));color:#000;padding:14px 18px;border-radius:14px;font-weight:800;font-size:13px;box-shadow:0 12px 40px rgba(0,230,118,.6);display:none;align-items:center;gap:10px;z-index:20;animation:slideIn .4s;max-width:340px}
.toast.show{display:flex}
@keyframes slideIn{from{transform:translateX(120%);opacity:0}to{transform:translateX(0);opacity:1}}
.toast b{font-size:15px;display:block;margin-bottom:2px}
#mn{position:fixed;top:72px;right:16px;background:linear-gradient(180deg,rgba(10,18,48,.99),rgba(15,22,55,.99));backdrop-filter:blur(28px);border:1px solid rgba(0,212,255,.4);border-radius:18px;padding:8px;min-width:260px;z-index:150;display:none;box-shadow:0 24px 70px rgba(0,0,0,.9),0 0 50px rgba(0,212,255,.2)}
#mn.open{display:block;animation:drop .25s}
@keyframes drop{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.mi{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:11px;color:#eaf0ff;cursor:pointer;font-size:13px;font-weight:700;background:transparent;border:none;width:100%;font-family:inherit;text-align:left;transition:all .2s}
.mi:hover{background:linear-gradient(135deg,rgba(0,212,255,.2),rgba(124,58,237,.2));color:#00d4ff;transform:translateX(3px)}
.mi .ico{font-size:17px;width:22px;text-align:center}
.msep{height:1px;background:linear-gradient(90deg,transparent,rgba(0,212,255,.3),transparent);margin:6px 10px}
.mtitle{padding:8px 14px;font-size:10px;font-weight:800;color:#7a86b0;letter-spacing:2px;text-transform:uppercase}
#modal{position:fixed;inset:0;background:rgba(5,6,20,.8);backdrop-filter:blur(12px);z-index:200;display:none;align-items:center;justify-content:center;padding:20px}
#modal.open{display:flex;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.mc{background:linear-gradient(135deg,rgba(15,22,55,.98),rgba(20,26,70,.98));border:1px solid rgba(0,212,255,.4);border-radius:22px;padding:26px;max-width:920px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:0 30px 90px rgba(0,0,0,.9),0 0 70px rgba(0,212,255,.15)}
.mc::-webkit-scrollbar{width:8px}
.mc::-webkit-scrollbar-thumb{background:rgba(0,212,255,.35);border-radius:4px}
.mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid rgba(0,212,255,.25)}
.mh h2{font-size:19px;font-weight:900;background:linear-gradient(135deg,#00d4ff,#a855f7,#f472b6);background-size:200% auto;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:txt 4s linear infinite}
.mclose{background:transparent;border:1px solid rgba(0,212,255,.3);color:#7a86b0;width:38px;height:38px;border-radius:11px;cursor:pointer;font-size:18px;font-family:inherit;transition:all .25s}
.mclose:hover{background:#ff3d5f;color:#fff;border-color:transparent;transform:rotate(90deg)}
.ct{font-size:11px;font-weight:800;color:#00d4ff;text-transform:uppercase;letter-spacing:2px;margin-bottom:12px;margin-top:8px}
.st{background:rgba(15,20,50,.7);border:1px solid rgba(0,212,255,.2);border-radius:11px;padding:12px 16px;display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px;transition:all .2s}
.st:hover{border-color:#00d4ff;transform:translateX(3px)}
.st b{font-family:monospace;font-weight:900;font-size:14px}
.tr{padding:12px 14px;border-radius:11px;background:rgba(15,20,50,.7);border:1px solid rgba(0,212,255,.2);font-size:12px;display:flex;justify-content:space-between;gap:10px;margin-bottom:8px;transition:all .2s}
.tr:hover{transform:translateX(3px)}
.tr.win{border-left:3px solid #00e676;box-shadow:-4px 0 14px rgba(0,230,118,.25)}
.tr.loss{border-left:3px solid #ff3d5f;box-shadow:-4px 0 14px rgba(255,61,95,.25)}
.tr.open{border-left:3px solid #ffb300;box-shadow:-4px 0 14px rgba(255,179,0,.25);animation:pu 2s infinite}
@keyframes pu{0%,100%{background:rgba(15,20,50,.7)}50%{background:rgba(255,179,0,.1)}}
.tpnl{font-weight:900;font-family:monospace;font-size:14px}
.tpnl.p{color:#00e676;text-shadow:0 0 8px rgba(0,230,118,.6)}
.tpnl.n{color:#ff3d5f;text-shadow:0 0 8px rgba(255,61,95,.6)}
.tt2{font-size:10px;color:#ffb300;font-family:monospace;font-weight:700;margin-top:4px}
.sgm{color:#7a86b0;font-size:11px;line-height:1.5}
.tg{background:linear-gradient(135deg,rgba(15,20,50,.9),rgba(25,30,70,.7));border:1px solid rgba(0,212,255,.35);color:#9aa4cc;padding:9px 16px;border-radius:11px;font-weight:800;font-size:12px;cursor:pointer;font-family:inherit;text-transform:uppercase;margin:0 8px 8px 0;letter-spacing:1px;transition:all .25s}
.tg.on{background:linear-gradient(135deg,#00e676,#00d4ff);color:#000;border-color:transparent;box-shadow:0 4px 22px rgba(0,230,118,.5)}
.tg:hover{border-color:#00d4ff;color:#00d4ff;transform:translateY(-1px)}
.chat{height:380px;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:10px;background:rgba(5,6,20,.5);border-radius:14px;border:1px solid rgba(0,212,255,.2);margin-bottom:12px}
.chat::-webkit-scrollbar{width:6px}
.chat::-webkit-scrollbar-thumb{background:rgba(0,212,255,.3);border-radius:3px}
.msg{padding:11px 15px;border-radius:14px;font-size:13px;line-height:1.6;max-width:88%;word-wrap:break-word;white-space:pre-wrap}
.msg.u{background:linear-gradient(135deg,#00d4ff,#7c3aed);color:#fff;align-self:flex-end;font-weight:500;box-shadow:0 4px 18px rgba(0,212,255,.4)}
.msg.a{background:rgba(15,20,50,.9);border:1px solid rgba(0,212,255,.25);align-self:flex-start}
.msg.a code{background:#0a1230;color:#00d4ff;padding:2px 6px;border-radius:5px;font-family:monospace;font-size:.85em}
.msg.a strong{color:#f472b6}
.ci{display:flex;gap:8px}
.ci textarea{flex:1;background:rgba(15,20,50,.9);border:1px solid rgba(0,212,255,.3);border-radius:12px;padding:11px 14px;color:#eaf0ff;font-family:inherit;font-size:13px;resize:none;min-height:46px;max-height:110px;outline:none;transition:all .25s}
.ci textarea:focus{border-color:#00d4ff;box-shadow:0 0 0 3px rgba(0,212,255,.2)}
.sbtn{background:linear-gradient(135deg,#00d4ff,#7c3aed);color:#fff;border:none;width:48px;border-radius:12px;cursor:pointer;font-size:20px;transition:all .25s}
.sbtn:hover{transform:scale(1.05);box-shadow:0 4px 22px rgba(0,212,255,.55)}
.tp{display:inline-flex;gap:4px}
.tp span{width:7px;height:7px;border-radius:50%;background:#00d4ff;animation:bo 1.2s infinite}
.tp span:nth-child(2){animation-delay:.15s;background:#7c3aed}
.tp span:nth-child(3){animation-delay:.3s;background:#f472b6}
@keyframes bo{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-6px);opacity:1}}
.ni{padding:12px 14px;border-radius:11px;background:rgba(15,20,50,.7);border:1px solid rgba(0,212,255,.25);font-size:12px;margin-bottom:10px;transition:all .2s;line-height:1.6}
.ni:hover{border-color:#00d4ff;transform:translateX(3px)}
.ni .src{font-size:10px;color:#7a86b0;margin-top:5px}
.imp{display:inline-block;padding:2px 9px;border-radius:999px;font-size:10px;font-weight:800;margin-left:8px}
.imp.high{background:rgba(255,61,95,.25);color:#ff3d5f}
.imp.med{background:rgba(255,179,0,.25);color:#ffb300}
.imp.low{background:rgba(0,230,118,.25);color:#00e676}
.lb{background:linear-gradient(135deg,rgba(0,230,118,.15),rgba(0,212,255,.12));border:1px solid rgba(0,230,118,.45);border-radius:14px;padding:14px;margin-bottom:14px;font-size:12px;line-height:1.8}
.lb b{color:#00e676}
.cpBadge{display:inline-block;background:rgba(0,230,118,.2);color:#00e676;padding:3px 8px;border-radius:6px;font-size:10px;font-weight:800;margin-right:6px}
.cpBadge.bear{background:rgba(255,61,95,.2);color:#ff3d5f}
.cpBadge.neu{background:rgba(255,179,0,.2);color:#ffb300}
</style>
</head>
<body>

/* ========= STATE ========= */
const state={
  prices:{},prev:{},candles:{},
  signals:[],decisions:[],trades:[],
  bal:10000,autoTrade:false,

async function loadSymbol(key){
  const s=state.symbols[key];if(!s)return;
  try{
    const r=await fetch('https://api.binance.com/api/v3/klines?symbol='+s.sym+'&interval='+state.tf+'&limit=300');
    const data=await r.json();
    const candles=data.map(k=>({time:Math.floor(k[0]/1000),open:+k[1],high:+k[2],low:+k[3],close:+k[4]}));
    const vols=data.map(k=>({time:Math.floor(k[0]/1000),value:+k[5],color:+k[4]>=+k[1]?'rgba(0,230,118,.4)':'rgba(255,61,95,.4)'}));
    state.candles[key]=data.map(k=>({t:k[0],o:+k[1],h:+k[2],l:+k[3],c:+k[4]}));
    state.prices[key]=+data[data.length-1][4];
    state.prev[key]=state.prices[key];
    if(key===state.focus){candleSeries.setData(candles);volSeries.setData(vols);updateEMALines();chart.timeScale().fitContent();}
    analyze(key);
  }catch(e){console.error('loadSymbol',key,e);}
}

const sockets={};
function connectWS(key){
  const s=state.symbols[key];if(!s)return;
  if(sockets[key]){try{sockets[key].close();}catch(e){}}
  const w=new WebSocket('wss://stream.binance.com:9443/ws/'+s.sym.toLowerCase()+'@kline_'+state.tf);
  sockets[key]=w;
  w.onmessage=e=>{
    const d=JSON.parse(e.data).k;
    const p=+d.c;
    state.prev[key]=state.prices[key]||p;
    state.prices[key]=p;
    if(key===state.focus){
      candleSeries.update({time:Math.floor(d.t/1000),open:+d.o,high:+d.h,low:+d.l,close:p});
      volSeries.update({time:Math.floor(d.t/1000),value:+d.v,color:p>=+d.o?'rgba(0,230,118,.4)':'rgba(255,61,95,.4)'});
    }
    const arr=state.candles[key]||[];
    const last=arr[arr.length-1];
    if(last&&last.t===d.t){last.h=+d.h;last.l=+d.l;last.c=p;}
    else{arr.push({t:d.t,o:+d.o,h:+d.h,l:+d.l,c:p});if(arr.length>300)arr.shift();analyze(key);}
    tickers();ut();
  };
  w.onclose=()=>setTimeout(()=>connectWS(key),4000);
  w.onerror=()=>w.close();
}

/* ========= INDICATORS ========= */
function em(a,p){if(a.length<p)return null;const k=2/(p+1);let e=a.slice(0,p).reduce((x,y)=>x+y,0)/p;for(let i=p;i<a.length;i++)e=a[i]*k+e*(1-k);return e;}
function rsi(c,p){p=p||14;if(c.length<p+1)return null;let g=0,l=0;for(let i=c.length-p;i<c.length;i++){const d=c[i]-c[i-1];if(d>=0)g+=d;else l-=d;}return 100-100/(1+(g/(l||1e-4)));}
function macd(c){if(c.length<26)return null;const e12=em(c,12),e26=em(c,26);if(!e12||!e26)return null;const l=e12-e26;const h=[];for(let i=26;i<=c.length;i++){const a=em(c.slice(0,i),12);const b=em(c.slice(0,i),26);if(a&&b)h.push(a-b);}const s=em(h.slice(-30),9);return{hist:l-(s||l)};}
function boll(c){if(c.length<20)return null;const s=c.slice(-20);const m=s.reduce((a,b)=>a+b,0)/20;const v=s.reduce((a,b)=>a+(b-m)*(b-m),0)/20;const d=Math.sqrt(v);return{u:m+2*d,m,l:m-2*d};}
function atr(a){if(a.length<2)return null;const s=a.slice(-14);return Math.max(...s.map(c=>c.h))-Math.min(...s.map(c=>c.l));}
function sr(a){if(a.length<10)return null;const s=a.slice(-30);const h=s.map(c=>c.h).sort((x,y)=>y-x);const l=s.map(c=>c.l).sort((x,y)=>x-y);return{r:h.slice(0,3).reduce((x,y)=>x+y,0)/3,s:l.slice(0,3).reduce((x,y)=>x+y,0)/3};}
function detectPattern(a){if(a.length<20)return null;const last=a.slice(-10);const closes=last.map(x=>x.c);const hh=closes[9]>closes[7]&&closes[7]>closes[5]&&closes[5]>closes[3];const ll=closes[9]<closes[7]&&closes[7]<closes[5]&&closes[5]<closes[3];const range=Math.max(...last.map(x=>x.h))-Math.min(...last.map(x=>x.l));const body=Math.abs(last[9].c-last[9].o);if(hh)return{name:'Higher Highs — Bullish',type:'bull'};if(ll)return{name:'Lower Lows — Bearish',type:'bear'};if(body/range<0.15)return{name:'Doji — Indecision',type:'neu'};if(body/range>0.7)return{name:last[9].c>last[9].o?'Strong Bullish Candle':'Strong Bearish Candle',type:last[9].c>last[9].o?'bull':'bear'};return{name:'Sideways',type:'neu'};}
function updateEMALines(){
  const arr=state.candles[state.focus];if(!arr||arr.length<21)return;
  const closes=arr.map(c=>c.c);
  const e9=[],e21=[];
  for(let i=9;i<=arr.length;i++){const e=em(closes.slice(0,i),9);if(e)ema9LineData(e,arr[i-1].t);}
  function ema9LineData(v,t){e9.push({time:Math.floor(t/1000),value:v});}
  const e9d=[],e21d=[];
  for(let i=21;i<=arr.length;i++){
    const e9v=em(closes.slice(0,i),9);
    const e21v=em(closes.slice(0,i),21);
    if(e9v!==null)e9d.push({time:Math.floor(arr[i-1].t/1000),value:e9v});
    if(e21v!==null)e21d.push({time:Math.floor(arr[i-1].t/1000),value:e21v});
  }
  ema9Line.setData(e9d);
  ema21Line.setData(e21d);
}

/* ========= ANALYSIS + LEARNING ========= */
function analyze(key){
  const a=state.candles[key];if(!a||a.length<30)return;
  const c=a.map(x=>x.c),p=state.prices[key];
  const e9=em(c,9),e21=em(c,21),e50=em(c,50),r=rsi(c,14),m=macd(c),b=boll(c),aT=atr(a),s=sr(a),pat=detectPattern(a);
  if(!e9||!e21||!r||!m||!b||!aT)return;
  let sc=0;const why=[];
  if(e9>e21){sc+=20;why.push('EMA9>EMA21');}else{sc-=20;why.push('EMA9<EMA21');}
  if(e50){if(p>e50){sc+=10;why.push('Above EMA50');}else{sc-=10;why.push('Below EMA50');}}
  if(r<30){sc+=25;why.push('RSI oversold '+r.toFixed(0));}else if(r>70){sc-=25;why.push('RSI overbought '+r.toFixed(0));}
  if(m.hist>0){sc+=15;why.push('MACD+');}else{sc-=15;why.push('MACD-');}
  if(p<b.l){sc+=20;why.push('Below BB');}else if(p>b.u){sc-=20;why.push('Above BB');}
  const pk=state.tf+':'+(e9>e21?'U':'D')+(r<35?'O':r>65?'B':'M')+(m.hist>0?'P':'N');
  const lr=state.learned[pk];
  if(lr&&lr.tot>=5){const wr=lr.w/lr.tot;if(wr>0.6){sc=Math.round(sc*1.15);why.push('🧠 '+Math.round(wr*100)+'% win');}else if(wr<0.4){sc=Math.round(sc*0.85);why.push('⚠ '+Math.round(wr*100)+'%');}}
  let act='wait',dir=null;
  if(sc>=40){act='buy';dir='buy';}else if(sc<=-40){act='sell';dir='sell';}
  const sd=aT*0.9,t1=aT*1.2,t2=aT*2.2;let sl=null,tp1=null,tp2=null,ex='';
  if(dir==='buy'){sl=p-sd;tp1=p+t1;tp2=p+t2;ex='Exit below '+sl.toFixed(2);}
  else if(dir==='sell'){sl=p+sd;tp1=p-t1;tp2=p-t2;ex='Exit above '+sl.toFixed(2);}
  else{ex='Wait break '+(s?s.r.toFixed(2):'?')+' / '+(s?s.s.toFixed(2):'?');}
  const d={key,label:state.symbols[key].label,act,dir,p,sl,tp1,tp2,str:Math.min(100,Math.abs(sc)+40),sc,why,ex,ts:Date.now(),e9,e21,e50,r,m,b,s,pk,pat,tf:state.tf};
  state.decisions=state.decisions.filter(x=>x.key!==key);state.decisions.unshift(d);
  if(state.decisions.length>60)state.decisions.pop();
  if(act!=='wait'&&Date.now()-(state.lastSignalTs[key]||0)>45000){
    state.lastSignalTs[key]=Date.now();
    state.signals.unshift(d);if(state.signals.length>40)state.signals.pop();
    beep();
    if(state.autoTrade)openTrade(d);
    if(key!==state.focus){notifySignal(d);if(state.autoSwitch)switchFocus(key);}
  }
  if(key===state.focus){renderSide(d);drawLines(d);}
  renderWL();
}

/* ========= AUTO TRADE ========= */
function openTrade(d){state.trades.unshift({id:Date.now()+Math.random(),symbol:d.label,key:d.key,dir:d.dir,e:d.p,sl:d.sl,tp:d.tp1,sz:.01,ot:Date.now(),dur:TD,st:'open',pnl:0,ep:null,er:null,pk:d.pk});if(state.trades.length>100)state.trades.pop();}
function ut(){
  let dirty=false;
  for(const t of state.trades){
    if(t.st!=='open')continue;
    const p=state.prices[t.key];if(!p)continue;
    const df=t.dir==='buy'?p-t.e:t.e-p;
    t.pnl=df*t.sz*100;
    const el=Date.now()-t.ot;let c=false;
    if(t.dir==='buy'){if(p<=t.sl){t.st='loss';t.ep=p;t.er='SL';c=true;}else if(p>=t.tp){t.st='win';t.ep=p;t.er='TP';c=true;}}
    else{if(p>=t.sl){t.st='loss';t.ep=p;t.er='SL';c=true;}else if(p<=t.tp){t.st='win';t.ep=p;t.er='TP';c=true;}}
    if(!c&&el>=t.dur){t.st=t.pnl>=0?'win':'loss';t.ep=p;t.er='Time';c=true;}
    if(c){
      t.ct=Date.now();state.bal+=t.pnl;
      if(!state.learned[t.pk])state.learned[t.pk]={w:0,l:0,tot:0};
      state.learned[t.pk].tot++;
      if(t.st==='win'){state.learned[t.pk].w++;state.wins++;state.streak=Math.max(1,state.streak+1);if(state.streak>state.bestStreak)state.bestStreak=state.streak;}
      else{state.learned[t.pk].l++;state.losses++;state.streak=Math.min(-1,state.streak-1);}
      saveState();
    }
    dirty=true;
  }
  if(dirty){ub();const m=document.getElementById('modal');if(m.classList.contains('open')){const t=document.getElementById('mtitle').textContent;if(t.includes('Auto'))mAuto();else if(t.includes('Statistics'))mStats();}}
}

function f(n,d){d=d===undefined?2:d;if(!n)return'—';return Number(n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});}
function ft(ms){const s=Math.max(0,Math.floor(ms/1000));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
function tickers(){

}
function beep(){try{const c=new (window.AudioContext||window.webkitAudioContext)();const o=c.createOscillator();const g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.setValueAtTime(880,c.currentTime);o.frequency.exponentialRampToValueAtTime(1400,c.currentTime+.15);g.gain.setValueAtTime(.0001,c.currentTime);g.gain.exponentialRampToValueAtTime(.2,c.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+.4);o.start();o.stop(c.currentTime+.4);}catch(e){}}

document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')document.getElementById('modal').classList.remove('open');});

function mLive(){const d=state.decisions.find(x=>x.key===state.focus);if(!d){openM('🎯 Live','<div class="ni">Loading...</div>');return;}const lv=d.sl?'<div class="st"><span>Entry</span><b style="color:#00d4ff">'+f(d.p)+'</b></div><div class="st"><span>Stop Loss</span><b style="color:#ff3d5f">'+f(d.sl)+'</b></div><div class="st"><span>TP1</span><b style="color:#00e676">'+f(d.tp1)+'</b></div><div class="st"><span>TP2</span><b style="color:#ffd54f">'+f(d.tp2)+'</b></div>':'<div class="ni">No signal.</div>';openM('🎯 Live — '+d.label,'<div class="ni"><b style="font-size:16px">'+d.act.toUpperCase()+'</b> • '+d.str+'%<br><br>'+d.why.join('<br>')+'</div><div class="ct">Levels</div>'+lv+'<div class="ct">Indicators</div><div class="st"><span>EMA9/21</span><b>'+f(d.e9)+' / '+f(d.e21)+'</b></div><div class="st"><span>RSI</span><b>'+d.r.toFixed(1)+'</b></div><div class="st"><span>MACD</span><b>'+d.m.hist.toFixed(3)+'</b></div><div class="st"><span>Support</span><b style="color:#00e676">'+f(d.s.s)+'</b></div><div class="st"><span>Resistance</span><b style="color:#ff3d5f">'+f(d.s.r)+'</b></div><div class="st"><span>Pattern</span><b>'+d.pat.name+'</b></div>');}
function mAuto(){const list=state.trades.length?state.trades.slice(0,30).map(t=>{const c=t.st==='open'?'open':t.st==='win'?'win':'loss';const pc=t.pnl>=0?'p':'n';const lb=t.st==='open'?'OPEN':t.st==='win'?'WIN ✅':'LOSS ❌';const rm=t.st==='open'?Math.max(0,t.dur-(Date.now()-t.ot)):0;return '<div class="tr '+c+'"><div style="flex:1"><b>'+t.symbol+' '+t.dir.toUpperCase()+'</b><div class="sgm">E '+f(t.e)+' • SL '+f(t.sl)+' • TP '+f(t.tp)+'</div>'+(t.st==='open'?'<div class="tt2">⏱ '+ft(rm)+' left</div>':'<div class="sgm">'+t.er+' @ '+f(t.ep)+'</div>')+'</div><div class="tpnl '+pc+'">'+(t.pnl>=0?'+':'')+'$'+f(t.pnl)+'<div class="sgm">'+lb+'</div></div></div>';}).join(''):'<div class="ni">No trades yet.</div>';openM('⚡ Auto Trade','<div class="ct">Balance: <span style="color:#00d4ff">$'+f(state.bal)+'</span></div><div style="margin-bottom:16px"><button class="tg '+(state.autoTrade?'on':'')+'" id="mat">'+(state.autoTrade?'Stop Auto':'Start Auto')+'</button><button class="tg" id="mrb">Reset Balance</button><button class="tg" id="mcl">Clear</button></div><div class="ct">Trades</div>'+list);setTimeout(()=>{const a=document.getElementById('mat');if(a)a.addEventListener('click',()=>{state.autoTrade=!state.autoTrade;a.className='tg '+(state.autoTrade?'on':'');a.textContent=state.autoTrade?'Stop Auto':'Start Auto';});const r=document.getElementById('mrb');if(r)r.addEventListener('click',()=>{if(confirm('Reset?')){state.bal=10000;state.trades=[];state.wins=0;state.losses=0;state.streak=0;ub();mAuto();}});const c=document.getElementById('mcl');if(c)c.addEventListener('click',()=>{state.trades=[];mAuto();});},100);}
function mSig(){const list=state.signals.length?state.signals.slice(0,40).map(s=>'<div class="ni"><div style="display:flex;justify-content:space-between;font-weight:900;margin-bottom:5px"><span>'+s.label+' • '+s.tf+'</span><span style="color:'+(s.dir==='buy'?'#00e676':'#ff3d5f')+'">'+s.dir.toUpperCase()+'</span></div><div class="sgm">E '+f(s.p)+' • SL '+f(s.sl)+' • TP '+f(s.tp1)+'</div><div class="sgm">Strength '+s.str+'% • '+new Date(s.ts).toLocaleTimeString()+'</div></div>').join(''):'<div class="ni">No signals yet.</div>';openM('📡 Signals History',list);}
function mStats(){const cl=state.trades.filter(t=>t.st!=='open');const w=cl.filter(t=>t.st==='win').length;const l=cl.filter(t=>t.st==='loss').length;const o=state.trades.filter(t=>t.st==='open').length;const tp=cl.reduce((a,t)=>a+t.pnl,0);const wr=cl.length?Math.round(w/cl.length*100):0;const best=cl.length?Math.max(...cl.map(t=>t.pnl)):0;const worst=cl.length?Math.min(...cl.map(t=>t.pnl)):0;openM('📈 Statistics','<div class="st"><span>Total P&L</span><b style="color:'+(tp>=0?'#00e676':'#ff3d5f')+'">'+(tp>=0?'+':'')+'$'+f(tp)+'</b></div><div class="st"><span>Closed</span><b>'+cl.length+'</b></div><div class="st"><span style="color:#00e676">Wins</span><b style="color:#00e676">'+w+'</b></div><div class="st"><span style="color:#ff3d5f">Losses</span><b style="color:#ff3d5f">'+l+'</b></div><div class="st"><span style="color:#ffb300">Open</span><b style="color:#ffb300">'+o+'</b></div><div class="st"><span>Win Rate</span><b style="color:#00d4ff">'+wr+'%</b></div><div class="st"><span>Best Trade</span><b style="color:#00e676">+$'+f(best)+'</b></div><div class="st"><span>Worst Trade</span><b style="color:#ff3d5f">$'+f(worst)+'</b></div><div class="st"><span>Streak</span><b>'+state.streak+'</b></div><div class="st"><span>Best Streak</span><b style="color:#ffd54f">'+state.bestStreak+'</b></div>');}
function mChat(){openM('💬 AI Chat','<div class="chat" id="mchb"><div class="msg a">👋 Ask me anything!<br>Example: <code>Analyze gold</code></div></div><div class="ci"><textarea id="mci" placeholder="Ask..." rows="1"></textarea><button class="sbtn" id="msb">➤</button></div>');setTimeout(()=>{const i=document.getElementById('mci'),b=document.getElementById('msb');b.addEventListener('click',()=>{const v=i.value.trim();if(!v)return;i.value='';aAI(v);});i.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();b.click();}});},100);}
const SYS='You are DARK AI — professional trading assistant. Brief answers. Provide: direction, entry, SL, TP1, TP2, confidence %. Educational only.';
async function aAI(t){const b=document.getElementById('mchb');if(!b)return;const u=document.createElement('div');u.className='msg u';u.textContent=t;b.appendChild(u);const th=document.createElement('div');th.className='msg a';th.innerHTML='<div class="tp"><span></span><span></span><span></span></div>';b.appendChild(th);b.scrollTop=b.scrollHeight;const cur=state.decisions.find(d=>d.key===state.focus);const ctx='\nGold '+f(state.prices.XAUUSD)+' BTC '+f(state.prices.BTCUSDT)+' Focus '+cur?.label+' Last '+(cur?cur.act:'none');try{const r=await puter.ai.chat(SYS+ctx+'\nQ: '+t);const tx=r&&r.message&&r.message.content?r.message.content:(r&&r.text?r.text:String(r));th.innerHTML=fAI(tx);}catch(e){th.innerHTML='⚠️ '+e.message;}b.scrollTop=b.scrollHeight;}
function fAI(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\n/g,'<br>');}
async function mNews(){openM('📰 News','<div class="ni">🧠 Analyzing...</div>');try{const p='5 events affecting gold & bitcoin. JSON only: {"items":[{"title":"","source":"","impact":"high|med|low","gold":"","btc":""}]}';const r=await puter.ai.chat(p);const tx=r&&r.message&&r.message.content?r.message.content:(r&&r.text?r.text:String(r));const m=tx.match(/\{[\s\S]*\}/);if(m){const d=JSON.parse(m[0]);document.getElementById('mbody').innerHTML=d.items.map(n=>'<div class="ni"><b>'+n.title+'</b><span class="imp '+(n.impact==='high'?'high':n.impact==='med'?'med':'low')+'">'+n.impact.toUpperCase()+'</span><div style="margin-top:6px">🥇 '+n.gold+'</div><div>₿ '+n.btc+'</div><div class="src">📰 '+n.source+'</div></div>').join('');}else{document.getElementById('mbody').innerHTML='<div class="ni">'+fAI(tx)+'</div>';}}catch(e){document.getElementById('mbody').innerHTML='<div class="ni">⚠️ '+e.message+'</div>';}}
function mLearn(){const keys=Object.keys(state.learned).sort((a,b)=>state.learned[b].tot-state.learned[a].tot);const rows=keys.length?keys.map(k=>{const l=state.learned[k];const wr=Math.round(l.w/l.tot*100);return '<div class="st"><span style="font-family:monospace;font-size:11px">'+k+'</span><b style="color:'+(wr>55?'#00e676':wr<45?'#ff3d5f':'#ffb300')+'">'+wr+'% ('+l.w+'/'+l.tot+')</b></div>';}).join(''):'<div class="ni">No data yet. Start Auto Trade.</div>';const total=state.wins+state.losses;const gwr=total?Math.round(state.wins/total*100):0;openM('🧠 AI Learning','<div class="lb"><b>Patterns:</b> '+keys.length+'<br><b>Overall WR:</b> '+gwr+'% ('+state.wins+'/'+total+')<br><b>Best Streak:</b> '+state.bestStreak+'</div><div class="ct">Per Timeframe</div>'+rows+'<div style="margin-top:16px"><button class="tg" id="mrs">🗑 Reset</button></div>');setTimeout(()=>{const r=document.getElementById('mrs');if(r)r.addEventListener('click',()=>{if(confirm('Reset?')){state.learned={};state.wins=0;state.losses=0;state.streak=0;state.bestStreak=0;saveState();mLearn();}});},100);}
function mWatch(){const all=['XAUUSD','BTCUSDT','ETHUSDT','SOLUSDT','BNBUSDT','XRPUSDT'];openM('👁 Watchlist','<div class="ct">Toggle symbols to monitor</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">'+all.map(k=>{const on=state.watchlist.includes(k)||k==='XAUUSD';return '<button class="tg '+(on?'on':'')+'" data-wk="'+k+'">'+state.symbols[k].icon+' '+state.symbols[k].label+'</button>';}).join('')+'</div><div class="ct" style="margin-top:20px">Auto-Switch</div><div class="ni">When a watchlist symbol gets a strong signal, DARK AI can auto-switch focus.<br><br><button class="tg '+(state.autoSwitch?'on':'')+'" id="msw">'+(state.autoSwitch?'✅ Enabled':'⛔ Disabled')+'</button></div>');setTimeout(()=>{document.querySelectorAll('[data-wk]').forEach(b=>b.addEventListener('click',()=>{const k=b.dataset.wk;if(k==='XAUUSD')return;if(state.watchlist.includes(k))state.watchlist=state.watchlist.filter(x=>x!==k);else{state.watchlist.push(k);if(!state.candles[k])loadSymbol(k);}mWatch();renderWL();}));const s=document.getElementById('msw');if(s)s.addEventListener('click',()=>{state.autoSwitch=!state.autoSwitch;mWatch();});},100);}
function mSettings(){openM('⚙️ Settings','<div class="st"><span>Symbol</span><b>'+state.symbols[state.focus].label+'</b></div><div class="st"><span>Timeframe</span><b>'+state.tf+'</b></div><div class="st"><span>Trade Duration</span><b>3 min</b></div><div class="st"><span>Auto Trade</span><b style="color:'+(state.autoTrade?'#00e676':'#ff3d5f')+'">'+(state.autoTrade?'ON':'OFF')+'</b></div><div class="st"><span>Auto-Switch</span><b style="color:'+(state.autoSwitch?'#00e676':'#ff3d5f')+'">'+(state.autoSwitch?'ON':'OFF')+'</b></div><div style="margin-top:16px"><button class="tg" id="mst">'+(state.autoTrade?'Disable':'Enable')+' Auto</button><button class="tg" id="mss">🔊 Test Sound</button><button class="tg" id="msf">📈 Fit Chart</button></div><div class="ct" style="margin-top:20px">About</div><div class="ni">DARK AI v3 Pro<br>Gold-focused • Watchlist monitoring • Multi-timeframe learning • Auto-switch on signal • Lightweight-charts + Puter.js AI</div>');setTimeout(()=>{const t=document.getElementById('mst');if(t)t.addEventListener('click',()=>{state.autoTrade=!state.autoTrade;mSettings();});const s=document.getElementById('mss');if(s)s.addEventListener('click',beep);const f=document.getElementById('msf');if(f)f.addEventListener('click',()=>chart&&chart.timeScale().fitContent());},100);}

/* ========= MENU ========= */
document.getElementById('m3').addEventListener('click',e=>{e.stopPropagation();document.getElementById('mn').classList.toggle('open');});
document.addEventListener('click',e=>{if(!e.target.closest('#mn')&&!e.target.closest('#m3'))document.getElementById('mn').classList.remove('open');});
document.querySelectorAll('.mi').forEach(b=>b.addEventListener('click',()=>{document.getElementById('mn').classList.remove('open');const m=b.dataset.m;if(m==='live')mLive();else if(m==='auto')mAuto();else if(m==='signals')mSig();else if(m==='stats')mStats();else if(m==='chat')mChat();else if(m==='news')mNews();else if(m==='learn')mLearn();else if(m==='watch')mWatch();else if(m==='settings')mSettings();}));

/* ========= TIMEFRAME ========= */
document.querySelectorAll('.tfb').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.tfb').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  state.tf=b.dataset.tf;
  state.candles={};
  state.lastSignalTs={};
  state.decisions=[];
  loadSymbol(state.focus);
  for(const k of state.watchlist){if(sockets[k]){try{sockets[k].close();}catch(e){}}}
  connectWS(state.focus);
  for(const k of state.watchlist)connectWS(k);
}));

/* ========= INIT ========= */
window.addEventListener('load',()=>{
  initChart();
  loadSymbol(state.focus);
  connectWS(state.focus);
  loadWatchlist();
  for(const k of state.watchlist)connectWS(k);
  ub();tickers();
  setInterval(tickers,500);
  setInterval(ub,1000);
  setInterval(()=>{const d=state.decisions.find(x=>x.key===state.focus);if(d)renderSide(d);},2000);
});
console.log('%c⚡ DARK AI v3 Pro ready','color:#00d4ff;font-size:16px;font-weight:bold');
</script>
</body>
</html>
